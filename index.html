<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tetris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff7;--ink:#1a1f36;--mute:#6a7190;--well:#f9faff;--grid:#e3e6f2;
  --btn:#ffffff;--line:#d3d8ea;--accent:#4a5cf0;--onaccent:#ffffff;--veil:rgba(236,239,247,.9);--veil2:rgba(236,239,247,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1224;--ink:#e8ebff;--mute:#8c93b8;--well:#171b36;--grid:#232848;--btn:#1d2242;--line:#2c3260;--accent:#7585ff;--onaccent:#0f1224;--veil:rgba(15,18,36,.88);--veil2:rgba(15,18,36,.5)}
}
:root[data-theme="dark"]{--bg:#0f1224;--ink:#e8ebff;--mute:#8c93b8;--well:#171b36;--grid:#232848;--btn:#1d2242;--line:#2c3260;--accent:#7585ff;--onaccent:#0f1224;--veil:rgba(15,18,36,.88);--veil2:rgba(15,18,36,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;overflow:hidden}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:10px 12px 18px;box-sizing:border-box}
.hud{display:grid;grid-template-columns:1.5fr 1fr 1fr auto auto;gap:8px;align-items:center}
.stat small{display:block;font-size:calc(var(--cs,20px)*.5);color:var(--mute)}
.stat b{display:block;font-size:calc(var(--cs,20px)*.85);font-variant-numeric:tabular-nums;line-height:1.2}
#next{display:block;border-radius:8px;border:1px solid var(--line);background:var(--well)}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:14px;touch-action:manipulation;cursor:pointer}
#pause{flex:none;width:calc(var(--cs,20px)*2.2);height:calc(var(--cs,20px)*2.2);font-size:calc(var(--cs,20px)*.8);padding:0}
#stage{position:relative;flex:1;min-height:0}
.well{position:absolute;line-height:0}
#side{position:absolute;display:flex;flex-direction:column;gap:6px;min-height:0}
#side .top{display:flex;gap:6px;align-items:center}
#side .meta{display:flex;flex-wrap:wrap;gap:0 6px;justify-content:space-between;font-size:calc(var(--cs,20px)*.5);color:var(--mute)}
#ol{font-size:calc(var(--cs,20px)*.55);font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mf{font-size:1.15em;vertical-align:middle}
#mywho{white-space:nowrap}
#ol[hidden]{display:none}
.fl{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-weight:400}
.ccr{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
#cc{max-width:150px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:14px}
#lvbox{display:flex;flex-direction:column;align-items:center;gap:16px}
#lvbox .lvr{display:flex;gap:6px}
#lvbox[hidden]{display:none}
#board{display:block;border-radius:10px;border:1px solid var(--line);background:var(--well);touch-action:none}
#ov{position:absolute;inset:0;border-radius:10px;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;line-height:1.4}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:34px;letter-spacing:-.02em}
#ov p{margin:0;font-size:14px;color:var(--mute);max-width:240px}
#go{margin-top:6px;padding:14px 34px;font-size:18px;font-weight:700;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
#settings{position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;padding:0;border-radius:50%;font-size:23px;display:flex;align-items:center;justify-content:center;line-height:1}
#settings:focus-visible{outline-offset:2px}
#cb{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--onaccent);font-size:13px;font-weight:700;line-height:1.4;pointer-events:none;white-space:nowrap}
#cb[hidden]{display:none}
#vs,#cpub,#rs,#qt,#netbox button,#lvbox button{padding:8px 14px;font-size:14px}
#lvbox .lvr button{padding:8px 10px}
#lback{background:transparent}
.sw{position:relative;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:6px 0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
#netbox{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center}
#netbox[hidden]{display:none}
#code{width:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:18px;text-align:center}
#opp{display:block;border-radius:8px;border:1px solid var(--line);background:var(--well)}
#opp[hidden]{display:none}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctl [data-act="left"]{grid-area:1/1}
.ctl [data-act="right"]{grid-area:1/2}
.ctl [data-act="rot"]{grid-area:1/3}
.ctl [data-act="down"]{grid-area:2/1/3/3}
.ctl [data-act="drop"]{grid-area:2/3}
.ctl button{height:54px;font-size:20px;font-weight:600}
.ctl button:active,.ctl button.on{transform:scale(.96);background:var(--line)}
.ctl [data-act="rot"],.ctl [data-act="drop"]{font-size:16px}
.ctl [data-act="rot"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{-webkit-user-select:text;user-select:text}
#ov{overflow:auto}
#settingsbox[hidden]{display:none}
.setting-title{font-size:18px;margin:8px 0 4px}
#settingsbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.language-row{width:min(280px,90%);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.language-row select{max-width:58%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit}
.music-volume{width:min(280px,90%);display:flex;flex-direction:column;gap:8px;text-align:left;margin:4px 0 8px}
.music-volume label{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.music-volume input[type=range]{width:100%;cursor:pointer;accent-color:var(--accent)}
#rk,#nbox button{padding:8px 14px;font-size:14px}
#nbox{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#nbox[hidden]{display:none}
#nick{width:150px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:16px;text-align:center}
#rank{position:fixed;inset:0;z-index:30;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:16px}
#rank[hidden]{display:none}
#ver{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);text-align:center;font-size:10px;line-height:1;color:var(--mute);opacity:.65;pointer-events:none}
.rk-card{width:min(100%,420px);max-height:100%;overflow:auto;background:var(--well);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.rk-card h2{margin:0 0 10px;font-size:22px}
#rank button{padding:10px 24px}
#rank .rk-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
#rstart{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
#rlist{list-style:none;margin:0;padding:0;text-align:left}
#rlist li{display:grid;grid-template-columns:28px 1fr auto;column-gap:10px;padding:8px 10px;border-radius:10px;line-height:1.3}
#rlist li:nth-child(odd){background:var(--btn)}
#rlist li.me{outline:2px solid var(--accent)}
#rlist .rn{grid-row:1/3;align-self:center;font-weight:700;color:var(--mute)}
#rlist li:first-child .rn{color:var(--accent)}
#rlist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rlist b{font-variant-numeric:tabular-nums;text-align:right}
#rlist small{grid-column:2/4;color:var(--mute)}
#rnote{margin:10px 0;font-size:13px;color:var(--mute)}
#ov.att{background:var(--veil2)}
#ov.att h1{background:linear-gradient(90deg,#2fc4e6,#4b6ff0,#a65bd8,#ee5a5a,#f28b3a,#f5c73b,#4cc46a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-size:40px}
#tt{position:absolute;top:38px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;line-height:1.4;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#tt[hidden]{display:none}
#bf{position:absolute;left:8px;top:8px;font-size:18px;line-height:1.1;letter-spacing:2px;pointer-events:none;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
#bf[hidden]{display:none}
.fly{position:fixed;left:0;top:0;z-index:80;pointer-events:none;line-height:1;white-space:nowrap;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;will-change:transform,opacity;filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,2px)}30%{transform:translate(6px,-3px)}45%{transform:translate(-5px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
.well.shake{animation:shk .45s}
@keyframes ohit{0%{box-shadow:0 0 0 0 rgba(229,72,77,.95);filter:brightness(1.5)}100%{box-shadow:0 0 18px 9px rgba(229,72,77,0);filter:none}}
#opp.hit{animation:ohit .6s}
@keyframes bhit{0%{box-shadow:inset 0 0 46px 12px rgba(229,72,77,.7)}100%{box-shadow:inset 0 0 0 0 rgba(229,72,77,0)}}
#board.hit{animation:bhit .65s}
#ov #rcfg{display:flex;flex-direction:column;align-items:center;margin:4px 0}
#ov #rcfg[hidden]{display:none}
#ov #rcfgtitle{font-weight:700;color:var(--ink);font-size:14px}
#ov #rcfgnote,#ov #cfgline{font-size:12px;max-width:260px}
#ov #itmhelp{font-size:12px;max-width:260px;text-align:left;margin:0 0 4px}
</style>
</head>
<body>

  <div id="stage">

        <button id="vs">2P Battle</button>
        <button id="rk">👑 Ranking</button>

  </div>
  <div class="ctl">

</div>

var op=$('opp'),ox=op.getContext('2d'),oc=10,cs=20,dpr=1,TH={well:'#f9faff',grid:'#e3e6f2'};

function theme(){
  var s=getComputedStyle(document.documentElement);
  TH.well=s.getPropertyValue('--well').trim()||TH.well;
  TH.grid=s.getPropertyValue('--grid').trim()||TH.grid;
}
function resize(){
  var st=$('stage'),w=st.clientWidth,h=st.clientHeight,gap=10;
  cs=Math.max(8,Math.floor(Math.min(h/ROWS,(w-gap)/(COLS*1.5))));
  oc=cs/2;
  dpr=window.devicePixelRatio||1;
  var W=cs*COLS,SW=W/2,H=cs*ROWS,x0=Math.max(0,Math.floor((w-W-gap-SW)/2)),y0=Math.max(0,Math.floor((h-H)/2));
  var wl=document.querySelector('.well'),sd=$('side'),vs=mode!=='solo';
  document.documentElement.style.setProperty('--cs',cs+'px');
  wl.style.left=x0+'px';wl.style.top=y0+'px';
  sd.style.left=(x0+W+gap)+'px';sd.style.top=y0+'px';sd.style.width=SW+'px';sd.style.height=H+'px';
  bc.style.width=W+'px';bc.style.height=H+'px';
  bc.width=Math.round(W*dpr);bc.height=Math.round(H*dpr);
  nc.style.width=SW+'px';nc.style.height=Math.round(cs*4)+'px';
  nc.width=Math.round(SW*dpr);nc.height=Math.round(cs*4*dpr);
  op.hidden=!vs;$('ol').hidden=!vs;
  op.style.width=SW+'px';op.style.height=cs*10+'px';
  op.width=Math.round(SW*dpr);op.height=Math.round(cs*10*dpr);
  olabel();
  theme();drawNext();
}

var gid=[],itm=[],pidc=0;
function emptyGrid(){var g=[];gid=[];itm=[];for(var r=0;r<ROWS;r++){g.push(new Array(COLS).fill(0));gid.push(new Array(COLS).fill(0));itm.push(new Array(COLS).fill(0))}return g}

/* ===== Item mode =====
   Some pieces carry one item cell (value 2 in the piece matrix). When the line holding that cell is cleared,
   the item fires automatically. Self items help you, attack items hit your opponent (online player or CPU).
   The item stream uses its own seeded random generator, so both online players see the very same item pieces. */
var ITEMS={bomb:{e:'💣'},laser:{e:'⚡'},nuke:{e:'💥'},slow:{e:'🐢'},shield:{e:'🛡️'},junk:{e:'🧱'},speed:{e:'🚀'},fog:{e:'🌫️'},rev:{e:'🌀'}};
var ATTACKS=['junk','speed','fog','rev'];
var POOL_SOLO=[['bomb',40],['laser',32],['nuke',8],['slow',20]];
var POOL_FULL=[['bomb',16],['laser',13],['nuke',4],['slow',9],['shield',11],['junk',17],['speed',11],['fog',9],['rev',10]];
var ITEM_P=.10,ITEM_GAP=5,sinceItem=0,irnd=Math.random;
var shield=false,fastUntil=0,slowUntil=0,fogUntil=0,revUntil=0,iseq=0,seenIq=0,boom=null,ttTimer=null,bfLast='';
var EMOJI_FONT='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
function pickKind(){
  var pool=mode==='solo'?POOL_SOLO:POOL_FULL,tot=0,i;
  for(i=0;i<pool.length;i++)tot+=pool[i][1];
  var x=irnd()*tot;
  for(i=0;i<pool.length;i++){x-=pool[i][1];if(x<0)return pool[i][0]}
  return pool[0][0];
}
function tagItem(p){
  if(++sinceItem<ITEM_GAP)return;
  if(irnd()>=ITEM_P)return;
  var cells=[],r,c;
  for(r=0;r<p.m.length;r++)for(c=0;c<p.m[r].length;c++)if(p.m[r][c])cells.push([r,c]);
  var pk=cells[Math.floor(irnd()*cells.length)];
  p.m[pk[0]][pk[1]]=2;p.ik=pickKind();sinceItem=0;
}
function icon(ctx,x,y,s,kind){
  var d=ITEMS[kind];if(!d)return;
  ctx.globalAlpha=.6;ctx.fillStyle='#ffffff';ctx.fillRect(x+2,y+2,s-4,s-4);ctx.globalAlpha=1;
  ctx.font=Math.max(8,Math.floor(s*.7))+'px '+EMOJI_FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';
  ctx.fillText(d.e,x+s/2,y+s/2+s*.04);
}
function itemName(k){return ITEMS[k].e+' '+tr('i_'+k)}
function toast(key,vars){
  var e=$('tt');e.textContent=fmt(key,vars);e.hidden=false;
  clearTimeout(ttTimer);ttTimer=setTimeout(function(){e.hidden=true},1800);
}
function renderBuffs(){
  var t='';
  if(shield)t+=ITEMS.shield.e;
  if(pt<fastUntil)t+=ITEMS.speed.e;
  if(pt<slowUntil)t+=ITEMS.slow.e;
  if(pt<fogUntil)t+=ITEMS.fog.e;
  if(pt<revUntil)t+=ITEMS.rev.e;
  if(t!==bfLast){bfLast=t;var e=$('bf');e.textContent=t;e.hidden=!t}
}
function sfxItem(){tone(700,.09,'square',.035);tone(1050,.12,'square',.035,.07)}
function sfxBoom(){tone(120,.25,'sawtooth',.07);tone(80,.3,'triangle',.07,.05)}
function sfxHit(){tone(200,.18,'sawtooth',.05);tone(150,.2,'sawtooth',.05,.1)}
function resetItemState(){
  shield=false;fastUntil=slowUntil=fogUntil=revUntil=0;iseq=0;seenIq=0;boom=null;sinceItem=0;itemTok++;clearFlyers();
  clearTimeout(ttTimer);$('tt').hidden=true;renderBuffs();
}
function endItems(){itemTok++;clearFlyers();shield=false;fastUntil=slowUntil=fogUntil=revUntil=0;boom=null;renderBuffs();$('tt').hidden=true}
function topRow(){for(var r=0;r<ROWS;r++)if(grid[r].some(Boolean))return r;return ROWS}
function wipe(r){grid[r].fill(0);gid[r].fill(0);itm[r].fill(0)}
/* The item cell was part of a cleared line: collect it before the rows disappear ... */
function collectItems(rows){
  var list=[];
  if(!itemMode)return list;
  rows.forEach(function(y){for(var c=0;c<COLS;c++)if(itm[y][c])list.push({k:itm[y][c],y:y,c:c})});
  return list;
}
/* ... and fire it right after the rows were removed (positional items aim at where the cell was). */
function applyItems(list,rows){
  if(!list||!list.length)return;
  list.forEach(function(o){
    var cy=o.y;
    if(!gravity)cy+=rows.filter(function(r){return r>o.y}).length;   /* classic mode: the stack above slides down */
    fireItem(o.k,cy,o.c);
  });
}
function fireItem(k,cy,cx){
  var r,c;
  toast('used',{n:itemName(k)});
  if(ATTACKS.indexOf(k)>=0){
    sfxItem();sfxWhoosh();
    var tok=itemTok,to=ctr('opp');
    if(mode==='vs'){iseq++;push({iq:iseq,ik:k})}
    fly(k,cellPt(cx,cy),to,680,function(){
      if(tok!==itemTok)return;
      stamp(k,to,false);pulse($('opp'),'hit');sfxHit();
      if(mode==='cpu')cpuReceive(k);
    });
    return;
  }
  if(k==='shield'){shield=true;sfxItem();renderBuffs();return}
  if(k==='slow'){slowUntil=pt+8000;sfxItem();renderBuffs();return}
  sfxBoom();
  if(k==='bomb'){            /* 5x5 blast around the item cell */
    var r0=Math.max(0,cy-2),r1=Math.min(ROWS-1,cy+2),c0=Math.max(0,cx-2),c1=Math.min(COLS-1,cx+2);
    for(r=r0;r<=r1;r++)for(c=c0;c<=c1;c++){grid[r][c]=0;gid[r][c]=0;itm[r][c]=0}
    boom={t:0,d:380,x:c0,y:r0,w:c1-c0+1,h:r1-r0+1,col:'#ff9f1c'};
  }else if(k==='laser'){     /* the whole column of the item cell */
    for(r=0;r<ROWS;r++){grid[r][cx]=0;gid[r][cx]=0;itm[r][cx]=0}
    boom={t:0,d:380,x:cx-.35,y:0,w:1.7,h:ROWS,col:'#ffe14d'};
  }else if(k==='nuke'){
    grid=emptyGrid();boom={t:0,d:450,x:0,y:0,w:COLS,h:ROWS,col:'#ffffff'};
  }
  /* gravity mode: the caller runs startFall() right after this, so floating blocks drop with the normal animation */
}
/* ===== Item flight animations: attacks fly from my item cell to the opponent's board, incoming ones fly to mine.
   Effects are applied when the icon lands. Browsers without the Web Animations API skip the animation (instant effect). */
var flyers=[],itemTok=0;
function clearFlyers(){while(flyers.length){var e=flyers.pop();if(e.parentNode)e.parentNode.removeChild(e)}}
function ctr(id,fx,fy){
  var e=$(id);if(!e||e.hidden)return null;
  var r=e.getBoundingClientRect();if(!r||!r.width)return null;
  return{x:r.left+r.width*(fx==null?.5:fx),y:r.top+r.height*(fy==null?.5:fy)};
}
function cellPt(cx,cy){return ctr('board',(cx+.5)/COLS,(cy+.5)/ROWS)}
function canAnimate(){return !!document.body&&typeof document.body.animate==='function'}
function pulse(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(function(){el.classList.remove(cls)},750)}
function sfxWhoosh(){tone(260,.18,'sine',.04);tone(520,.2,'sine',.03,.08)}
function fly(kind,a,b,dur,done){
  var fin=false;
  function end(){if(fin)return;fin=true;if(done)done()}
  var d=ITEMS[kind];
  if(!d||!a||!b||!canAnimate()){end();return}
  var size=Math.max(28,Math.round(cs*1.5)),N=16,i,n,els=[];
  var mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-Math.max(90,Math.hypot(a.x-b.x,a.y-b.y)*.55);
  var pts=[];
  for(i=0;i<=N;i++){var t=i/N,u=1-t;pts.push([u*u*a.x+2*u*t*mx+t*t*b.x,u*u*a.y+2*u*t*my+t*t*b.y])}
  function layer(n){
    var el=document.createElement('div'),sz=Math.round(size*(1-n*.14));
    el.className='fly';el.textContent=d.e;el.style.fontSize=sz+'px';
    document.body.appendChild(el);flyers.push(el);els.push(el);
    var frames=pts.map(function(p,j){
      var t=j/N,grow=1+.5*Math.sin(Math.PI*t);
      return{offset:t,opacity:n?Math.max(.1,.6-n*.14):1,
        transform:'translate('+Math.round(p[0]-sz/2)+'px,'+Math.round(p[1]-sz/2)+'px) rotate('+Math.round(t*(n%2?-540:540))+'deg) scale('+grow.toFixed(2)+')'};
    });
    return el.animate(frames,{duration:dur,delay:n*55,easing:'cubic-bezier(.35,.05,.55,1)',fill:'both'});
  }
  var main=layer(0);
  for(n=1;n<4;n++)layer(n);
  var timer=setTimeout(finish,dur+500);
  function finish(){
    clearTimeout(timer);
    setTimeout(function(){els.forEach(function(e){if(e.parentNode)e.parentNode.removeChild(e)})},300);
    end();
  }
  main.onfinish=finish;
}
function stamp(kind,p,big){
  var d=ITEMS[kind];if(!d||!p||!canAnimate())return;
  var sz=Math.round(cs*(big?3.2:2.2)),el=document.createElement('div');
  el.className='fly';el.textContent=d.e;el.style.fontSize=sz+'px';
  document.body.appendChild(el);flyers.push(el);
  var tx='translate('+Math.round(p.x-sz/2)+'px,'+Math.round(p.y-sz/2)+'px)';
  var an=el.animate([{transform:tx+' scale(.3)',opacity:0},{transform:tx+' scale(1.15)',opacity:1,offset:.35},{transform:tx+' scale(1.5)',opacity:0}],{duration:650,easing:'ease-out',fill:'both'});
  an.onfinish=function(){if(el.parentNode)el.parentNode.removeChild(el)};
}
function receiveItem(k){
  if(!itemMode||ATTACKS.indexOf(k)<0)return;
  var tok=itemTok;
  sfxWhoosh();
  fly(k,ctr('opp'),ctr('board'),720,function(){
    if(tok!==itemTok||(state!=='playing'&&state!=='anim'&&state!=='clear'))return;
    landItem(k);
  });
}
function landItem(k){
  var c=ctr('board');
  if(shield){shield=false;renderBuffs();toast('blocked');sfxItem();stamp('shield',c,true);return}
  if(k==='junk')pend=Math.min(pend+3,ROWS);
  else if(k==='speed')fastUntil=pt+8000;
  else if(k==='fog')fogUntil=pt+7000;
  else if(k==='rev')revUntil=pt+8000;
  toast('hit_'+k);sfxHit();renderBuffs();
  stamp(k,c,true);pulse($('board'),'hit');pulse(document.querySelector('.well'),'shake');
}
function cpuReceive(k){
  if(!cpu)return;
  if(k==='junk')cpu.pend+=3;else cpu.dizzy=pt+8000;   /* speed/fog/reverse: the CPU misplaces pieces for a while */
}
function pull(){
  if(!bag.length){
    bag=KEYS.slice();
    for(var i=bag.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=bag[i];bag[i]=bag[j];bag[j]=t}
  }
  return bag.pop();
}
function mk(t){var m=SH[t].map(function(r){return r.slice()});var p={t:t,m:m,id:++pidc,x:Math.floor((COLS-m[0].length)/2),y:0};if(itemMode)tagItem(p);return p}
function rot(m){return m[0].map(function(_,i){return m.map(function(r){return r[i]}).reverse()})}
function hit(m,x,y){
  for(var r=0;r<m.length;r++)for(var c=0;c<m[r].length;c++){
    if(!m[r][c])continue;
    var gx=x+c,gy=y+r;
    if(gx<0||gx>=COLS||gy>=ROWS)return true;
    if(gy>=0&&grid[gy][gx])return true;
  }
  return false;
}

function spawn(){
  if(pend>0){addGarbage();if(state==='over')return}
  cur=next||mk(pull());next=mk(pull());
  drawNext();
  if(hit(cur.m,cur.x,cur.y))over();
}
function move(d){
  if(pt<revUntil)d=-d;
  if(state==='playing'&&!hit(cur.m,cur.x+d,cur.y)){
    cur.x+=d;
    // Sound is intentionally subtle; throttle rapid key-repeat movement.
    var now=performance.now();
    if(!move._lastSfx||now-move._lastSfx>85){sfxMove();move._lastSfx=now}
  }
}
function rotate(){
  if(state!=='playing')return;
  /* wall kicks (sideways) first, then floor kicks (upwards) so pieces can turn on the stack or on garbage */
  var r=rot(cur.m),k=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1],[0,-2]];
  for(var i=0;i<k.length;i++){
    if(!hit(r,cur.x+k[i][0],cur.y+k[i][1])){cur.m=r;cur.x+=k[i][0];cur.y+=k[i][1];sfxRotate();return}
  }
}
function soft(){
  if(state!=='playing')return;
  if(!hit(cur.m,cur.x,cur.y+1)){cur.y++;score+=1;acc=0;hud();tone(260,.035,'sine',.018)}else lock();
}
function hard(){
  if(state!=='playing')return;
  var n=0;
  while(!hit(cur.m,cur.x,cur.y+1)){cur.y++;n++}
  score+=2*n;lock();
}
function lock(){
  sfxPlace();
  for(var r=0;r<cur.m.length;r++)for(var c=0;c<cur.m[r].length;c++){
    if(cur.m[r][c]){
      var gy=cur.y+r,gx=cur.x+c;
      if(gy>=0){grid[gy][gx]=cur.t;gid[gy][gx]=cur.id;if(cur.m[r][c]===2&&cur.ik)itm[gy][gx]=cur.ik}
    }
  }
  var rows=fullRows(),n=rows.length;
  streak=0;
  if(n){
    var its=collectItems(rows);
    sfxClear(n);
    award(n,1);hud();attack(n,false);
    beginClear(rows,function(){
      clearRows();applyItems(its,rows);
      if(gravity&&startFall()){streak=1;return}
      state='playing';acc=0;spawn();
    });
    return;
  }
  showCombo();
  hud();acc=0;
  spawn();
}
function clearRows(){
  var n=0;
  for(var y=ROWS-1;y>=0;y--){
    if(grid[y].every(Boolean)){
      n++;
      if(gravity){grid[y].fill(0);gid[y].fill(0);itm[y].fill(0)}
      else{grid.splice(y,1);grid.unshift(new Array(COLS).fill(0));gid.splice(y,1);gid.unshift(new Array(COLS).fill(0));itm.splice(y,1);itm.unshift(new Array(COLS).fill(0));y++}
    }
  }
  return n;
}
function award(n,mult){
  score+=Math.round([0,100,300,500,800][Math.min(n,4)]*level*mult*(1+Math.min(streak,10)*0.1));
  lines+=n;level=1+Math.floor(lines/10);
}

/* Gravity animation: floating pieces fall with acceleration; lines completed on landing chain */
var fall=[],fs=0,fv=0,streak=0,fx=null,FLASH=90,FXD=330;
function fullRows(){var a=[];for(var y=0;y<ROWS;y++)if(grid[y].every(Boolean))a.push(y);return a}
function beginClear(rows,done){
  var parts=[];
  rows.forEach(function(y){
    for(var c=0;c<COLS;c++){
      var col=COL[grid[y][c]];
      for(var q=0;q<4;q++)parts.push({x:c+(q%2)*.5,y:y+(q>>1)*.5,vx:(Math.random()-.5)*.008+((q%2)-.5)*.002,vy:-Math.random()*.005-.001,col:col});
    }
  });
  fx={rows:rows,t:0,done:done,parts:parts};
  cur=null;state='clear';
}
function showCombo(){
  var e=$('cb');
  if(streak>0){e.textContent='COMBO '+streak+'  +'+Math.min(streak,10)*10+'%';e.hidden=false}
  else e.hidden=true;
}
function startFall(){
  fall=[];fs=0;fv=0;
  var seen=[],units=[],occ=[],r,c;
  for(r=0;r<ROWS;r++){seen.push(new Array(COLS).fill(false));occ.push(new Array(COLS).fill(-1))}
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(!grid[r][c]||seen[r][c])continue;
    var u={cells:[],d:0,g:false},st=[[r,c]],pid=gid[r][c];
    seen[r][c]=true;
    while(st.length){
      var cp=st.pop(),pr=cp[0],pc=cp[1];
      u.cells.push({r:pr,c:pc,t:grid[pr][pc],it:itm[pr][pc]});
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var nr=pr+d[0],nk=pc+d[1];
        if(nr>=0&&nr<ROWS&&nk>=0&&nk<COLS&&!seen[nr][nk]&&grid[nr][nk]&&gid[nr][nk]===pid){seen[nr][nk]=true;st.push([nr,nk])}
      });
    }
    units.push(u);
  }
  for(var iter=0;iter<=ROWS;iter++){
    for(r=0;r<ROWS;r++)occ[r].fill(-1);
    units.forEach(function(u,i){u.g=false;u.cells.forEach(function(k){occ[k.r+u.d][k.c]=i})});
    var ch=true;
    while(ch){
      ch=false;
      units.forEach(function(u,i){
        if(u.g)return;
        for(var j=0;j<u.cells.length;j++){
          var k=u.cells[j],br=k.r+u.d+1;
          if(br>=ROWS||(occ[br][k.c]>=0&&occ[br][k.c]!==i&&units[occ[br][k.c]].g)){u.g=true;ch=true;return}
        }
      });
    }
    var mv=units.filter(function(u){return !u.g});
    if(!mv.length)break;
    mv.forEach(function(u){u.d++});
  }
  units.forEach(function(u){
    if(!u.d)return;
    u.cells.forEach(function(k){fall.push({c:k.c,y0:k.r,to:k.r+u.d,t:k.t,id:gid[k.r][k.c],it:k.it})});
  });
  if(!fall.length)return false;
  fall.forEach(function(f){grid[f.y0][f.c]=0;gid[f.y0][f.c]=0;itm[f.y0][f.c]=0});
  cur=null;state='anim';
  return true;
}
function landFall(){
  fall.forEach(function(f){grid[f.to][f.c]=f.t;gid[f.to][f.c]=f.id;if(f.it)itm[f.to][f.c]=f.it});
  fall=[];
  var rows=fullRows();
  if(rows.length){
    var its=collectItems(rows);
    streak++;sfxClear(rows.length);sfxCombo(streak);showCombo();award(rows.length,1);hud();attack(rows.length,true);
    beginClear(rows,function(){
      clearRows();applyItems(its,rows);
      if(startFall())return;
      finishFall();
    });
    return;
  }
  finishFall();
}
function finishFall(){
  state='playing';acc=0;spawn();
  setTimeout(function(){if(state==='playing'&&!fall.length){streak=0;showCombo()}},1200);
}
function interval(){var v=Math.max(90,820-(level-1)*70);if(pt<fastUntil)v=Math.max(55,v*.3);if(pt<slowUntil)v*=2.5;return v}

function hud(){$('sc').textContent=score;$('lv').textContent=level;$('ln').textContent=lines}

/* Overlay text is stored as translation keys (or functions that build a string) so that it can be
   re-rendered in another language without losing the current state. */
var ovT='tetris',ovS='',ovB='',ovBest=false;
function txtOf(x){return typeof x==='function'?x():(x?tr(x):'')}
function fmt(key,v){return tr(key).replace(/\{(\w+)\}/g,function(m,k){return v&&k in v?v[k]:m})}
function fm(key,v){return function(){return fmt(key,v)}}
function setOS(x){ovS=x;$('os').textContent=txtOf(x)}
function renderOverlay(){
  $('ot').textContent=ovT==='tetris'?'TETRIS':txtOf(ovT);   /* main title is never translated */
  $('os').textContent=txtOf(ovS);
  $('go').textContent=txtOf(ovB);
  $('ob').textContent=ovBest?(tr('best')+' '+best):'';
  renderCfg();
}
function overlay(title,sub,btn,showBest){
  ovui(true);
  ovT=title;ovS=sub;ovB=btn;ovBest=!!showBest;
  renderOverlay();
  /* Main menu starts from the Ranking board; keep direct Start for pause/game-over screens. */
  if(title==='tetris')$('go').style.display='none';
  $('ov').classList.toggle('att',title==='tetris');
  $('ov').hidden=false;

function cpuHit(g,m,x,y){
  for(var r=0;r<m.length;r++)for(var c=0;c<m[r].length;c++){
    if(!m[r][c])continue;

  while(!cpuHit(g,m,x,y+1))y++;

  for(r=0;r<m.length;r++)for(c=0;c<m[r].length;c++){if(m[r][c]&&y+r>=0)g2[y+r][x+c]=t}
  var n=0;
  for(r=ROWS-1;r>=0;r--){if(g2[r].every(Boolean)){g2.splice(r,1);g2.unshift(new Array(COLS).fill(0));n++;r++}}
  var h=[],holes=0,agg=0,bump=0;

    var ht=top<0?0:ROWS-top;h.push(ht);agg+=ht;
    if(top>=0)for(r=top;r<ROWS;r++)if(!g2[r][c])holes++;
  }

/* Supabase Realtime adapter: Presence carries join/ready state, Broadcast carries fast-changing data (board, attacks). */
function createSupabaseRoom(code){
  var client=getClient();
  var peerId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('p-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  /* Supabase allows only 5 Presence track()/untrack() calls per client per 30 seconds and shuts the channel
     down when that is exceeded. So Presence is used once per connection (who is here), and ALL game state
     (ready, seed, dead, attacks, board...) is sent as a full-state Broadcast, repeated as a heartbeat. */
  var FIELDS=['rdy','dead','gs','atk','seed','gv','it','sv','lk','iq','ik','cc','g','sc'];
  var localState={rdy:false,dead:false,gs:0,atk:0,seed:0,gv:0,it:0,sv:0,lk:0,iq:0,ik:'',cc:myCC||'',t:Date.now(),g:'',sc:0};
  var remote={},seenKeys={},peerHandler=null,lostHandler=null,lostTimer=null,retryTimer=null,hbTimer=null,flushTimer=null,lastFlush=0;
  var retries=0,subscribed=false,left=false,verCounter=0,channel=null,firstDone=false,lastStatus='';
  function validValue(k,v){
    if(k==='rdy'||k==='dead')return typeof v==='boolean';
    if(k==='gs'||k==='seed'||k==='t')return typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=Number.MAX_SAFE_INTEGER;
    if(k==='atk')return typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1000000;
    if(k==='sc')return typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100000000;
    if(k==='gv'||k==='it')return v===0||v===1||v===false||v===true;
    if(k==='lk')return v===0||v===1||v===false||v===true;
    if(k==='sv')return typeof v==='number'&&Number.isInteger(v)&&v>=0&&v<=1000000;
    if(k==='iq')return typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1000000;
    if(k==='ik')return v===''||(typeof v==='string'&&ATTACKS.indexOf(v)>=0);
    if(k==='cc')return typeof v==='string'&&(/^$|^[A-Z]{2}$/.test(v));
    if(k==='kind')return v==='viewer';
    if(k==='g')return typeof v==='string'&&v.length===COLS*ROWS&&/^[.IOTSZJLG]+$/.test(v);
    return false;
  }
  function getPeers(){
    var ps=channel?channel.presenceState():{},out=[];
    Object.keys(ps||{}).forEach(function(key){
      var arr=ps[key]||[];if(!arr.length)return;
      var meta=arr[arr.length-1]||{},pres={kind:'viewer',rdy:false,dead:false,gs:0,atk:0};
      ['t','cc'].forEach(function(k){if(validValue(k,meta[k]))pres[k]=meta[k]});
      if(key===peerId){
        FIELDS.concat(['t']).forEach(function(k){if(validValue(k,localState[k]))pres[k]=localState[k]});
      }else if(remote[key]){
        Object.keys(remote[key].state).forEach(function(k){pres[k]=remote[key].state[k]});pres.at=remote[key].at;
      }
      out.push({kind:'viewer',peer:key,sameTab:key===peerId,presence:pres});
    });
    return out;
  }
  function notify(){
    var peers=getPeers(),fresh=false;
    peers.forEach(function(p){if(!p.sameTab&&!seenKeys[p.peer]){seenKeys[p.peer]=1;fresh=true}});
    if(fresh&&subscribed)scheduleFlush();   /* introduce ourselves to a newly arrived peer */
    if(peerHandler)peerHandler({peers:peers});
  }
  function onGame(message){
    var packet=message&&message.payload;
    if(!packet||typeof packet.peerId!=='string'||packet.peerId.length>100||packet.peerId===peerId||!packet.data||typeof packet.data!=='object'||Array.isArray(packet.data))return;
    var v=Number(packet.v);if(!Number.isFinite(v)||v<0)return;
    var r=remote[packet.peerId];
    if(r&&v<r.v)return;                      /* older than what we already have */
    if(!r&&Object.keys(remote).length>=20)return;
    var ns={};
    if(r)Object.keys(r.state).forEach(function(k){ns[k]=r.state[k]});
    FIELDS.concat(['t']).forEach(function(k){if(k in packet.data&&validValue(k,packet.data[k]))ns[k]=packet.data[k]});
    remote[packet.peerId]={v:v,state:ns,at:Date.now()};
    notify();
  }
  function sendNow(){
    clearTimeout(flushTimer);flushTimer=null;
    if(!subscribed||!channel||left)return Promise.resolve('queued');
    lastFlush=Date.now();
    var data={};
    FIELDS.concat(['t']).forEach(function(k){if(validValue(k,localState[k]))data[k]=localState[k]});
    clearTimeout(hbTimer);hbTimer=setTimeout(function(){if(!left)sendNow()},2500);
    try{
      return Promise.resolve(channel.send({type:'broadcast',event:'game',payload:{peerId:peerId,v:++verCounter,data:data}})).catch(function(){return 'error'});
    }catch(e){return Promise.resolve('error')}
  }
  function scheduleFlush(){
    if(flushTimer||left)return;
    flushTimer=setTimeout(sendNow,Math.max(0,150-(Date.now()-lastFlush)));   /* at most ~6 messages per second */
  }
  /* If the connection drops, rebuild the channel with the same identity and re-announce our state.
     Only after 30 seconds without success do we tell the game that the connection is lost. */
  function setLost(status){
    lastStatus=status;subscribed=false;
    console.warn('[tetris] realtime status:',status);
    if(!lostTimer)lostTimer=setTimeout(function(){lostTimer=null;if(!left&&lostHandler)lostHandler(lastStatus)},30000);
    clearTimeout(retryTimer);
    retryTimer=setTimeout(rebuild,Math.min(1000*(++retries),5000));
  }
  function rebuild(){
    if(left)return;
    var old=channel;
    subscribed=false;
    (old?Promise.resolve(client.removeChannel(old)):Promise.resolve()).catch(function(){}).then(function(){if(!left)connect(null)});
  }
  function connect(done){
    var ch=client.channel('tt-'+code,{config:{presence:{key:peerId},broadcast:{self:false,ack:false}}});
    channel=ch;
    ch.on('presence',{event:'sync'},notify);
    ch.on('presence',{event:'leave'},function(p){var k=p&&p.key;if(k){delete remote[k];delete seenKeys[k]}});
    ch.on('broadcast',{event:'game'},onGame);
    ch.subscribe(function(status){
      if(left||ch!==channel)return;
      if(status==='SUBSCRIBED'){
        clearTimeout(lostTimer);lostTimer=null;clearTimeout(retryTimer);retries=0;
        subscribed=true;
        ch.track({kind:'viewer',t:localState.t,cc:localState.cc}).then(function(){
          notify();scheduleFlush();
          if(!firstDone){firstDone=true;if(done)done()}
        }).catch(function(e){if(!firstDone){firstDone=true;if(done)done(e||new Error(tr('joinfail')))}});
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        if(!firstDone){firstDone=true;if(done)done(new Error(tr('rtfail')+' '+status));return}
        setLost(status);
      }
    });
  }
  var api={
    peers:getPeers,
    onPeers:function(fn){peerHandler=fn;notify()},
    onLost:function(fn){lostHandler=fn},
    poke:function(){if(!left&&!subscribed){clearTimeout(retryTimer);rebuild()}},
    presence:function(data){
      Object.keys(data||{}).forEach(function(k){if(FIELDS.indexOf(k)>=0)localState[k]=data[k]});
      scheduleFlush();
      return Promise.resolve('queued');
    },
    leave:function(){left=true;subscribed=false;clearTimeout(lostTimer);clearTimeout(retryTimer);clearTimeout(hbTimer);clearTimeout(flushTimer);return channel?client.removeChannel(channel):Promise.resolve()}
  };
  return new Promise(function(resolve,reject){
    connect(function(err){if(err)reject(err);else resolve(api)});
  });
}

/* ===== Ranking (top 5): global via Supabase table "scores", local fallback =====
   Client-side validation improves reliability but is NOT a security boundary.
   Enable RLS and restrictive INSERT/SELECT policies in Supabase; for cheat-resistant
   rankings, validate scores on a trusted server/Edge Function rather than direct INSERT. */
var RANK_N=5,rankTok=0,pendingScore=null;
function localBoard(){try{var a=JSON.parse(localStorage.getItem('tetris-top5')||localStorage.getItem('tetris-top10')||'[]');return Array.isArray(a)?a.slice(0,RANK_N):[]}catch(e){return[]}}

  e=normalizeScoreEntry(e);if(!e)return false;
  var a=localBoard().filter(function(x){return x&&Number.isFinite(+x.score)&&+x.score>=0&&+x.score<=100000000;});
  a.push({nick:e.nick,score:e.score,lines:e.lines,cc:e.cc||''});
  a.sort(function(x,y){return y.score-x.score});
  try{localStorage.setItem('tetris-top5',JSON.stringify(a.slice(0,RANK_N)))}catch(err){}
  return false;
}
function normalizeScoreEntry(e){
  if(!e||!Number.isSafeInteger(Number(e.score))||Number(e.score)<0||Number(e.score)>100000000||!Number.isSafeInteger(Number(e.lines))||Number(e.lines)<0||Number(e.lines)>100000||!Number.isSafeInteger(Number(e.level))||Number(e.level)<1||Number(e.level)>10000)return null;
  return {nick:cleanNick(e.nick),score:Number(e.score),lines:Number(e.lines),level:Number(e.level),cc:okc(e.cc)?e.cc:''};
}
function loadBoard(){

        .then(function(r){if(r.error)throw r.error;return{rows:r.data||[],remote:true}})
        .catch(function(err){console.warn('Ranking load failed:',err);return{rows:localBoard(),remote:false}});
    }catch(e){}

function submitScore(e){

        .then(function(r){if(r.error)throw r.error;return true})

/* ===== shared online match settings (shown in the room before the first game, read-only afterwards) ===== */

function renderCfg(){

var leftTimer=null;
function onPeers(ch){lastPeers=ch;onPeersCore(ch);renderCfg()}
function onPeersCore(ch){
  var ps=ch.peers.filter(function(p){return p.kind==='viewer'});
  ps.sort(function(a,b){return ((a.presence.t||0)-(b.presence.t||0))||(a.peer<b.peer?-1:1)});
  var two=ps.slice(0,2);
  opp=null;meP=null;
  for(var i=0;i<two.length;i++){var p=two[i];if(p.sameTab)meP=p;else opp=p}
  olabel();
  /* shared match settings: adopt the other player's change (or their locked settings) before the first game */
  if(mode==='vs'&&opp&&!cfgLocked&&(state==='net'||state==='over')){
    var pp=opp.presence,psv=Number(pp.sv)||0,plk=pp.lk===1||pp.lk===true,ng=pp.gv?1:0,ni=pp.it?1:0;
    var diff=ng!==cfg.gv||ni!==cfg.it;
    var theirsWin=psv>cfg.sv||(psv===cfg.sv&&diff&&meP&&(Number(pp.t)||0)<(Number(meP.presence.t)||0));
    if(plk||theirsWin){
      cfg={gv:ng,it:ni,sv:Math.max(psv,cfg.sv)};
      if(plk)cfgLocked=true;
      if(diff&&myRdy){myRdy=false;push({rdy:false})}
      if(diff)noteFlash();
    }
  }
  if(!meP&&state==='net'&&ps.some(function(q){return q.sameTab})){
    leaveRoom();state='ready';mode='solo';resize();
    overlay('battleTitle','roomfull','',false);
    ovui(false);$('netbox').hidden=false;
    return;
  }
  if(state==='playing'||state==='anim'||state==='clear'){
    if(!opp){
      if(!leftTimer)leftTimer=setTimeout(function(){leftTimer=null;if(!opp&&(state==='playing'||state==='anim'||state==='clear'))win('oppleft')},8000);
      return;
    }
    clearTimeout(leftTimer);leftTimer=null;
    var P=opp.presence;
    if(P.gs===gs){
      var a=Math.min(1000000,Math.max(0,Math.floor(Number(P.atk)||0)));
      if(a>seen){var take=Math.min(a-seen,6);pend=Math.min(pend+take,ROWS);seen+=take}
      var iqv=Math.min(1000000,Math.max(0,Math.floor(Number(P.iq)||0)));
      if(iqv>seenIq){seenIq=iqv;receiveItem(P.ik)}
      if(P.dead===true)win('opptopped');

  }
  if(!opp&&myRdy&&(state==='net'||state==='over'))setOS('waitreconn');
  if(state==='over'&&mode==='vs'&&!myRdy&&opp&&opp.presence.rdy===true)setOS('wantsrematch');
  if(state==='net'&&!myRdy){
    var occ=opp&&okc(opp.presence.cc)?opp.presence.cc:'',rc=roomCode;setOS(opp?(occ?function(){return fmt('oppjoinedfrom',{c:cname(occ)})}:'oppjoined'):fm('waitopp',{c:rc}));

}
function ready(){
  if(!room||!opp){setOS('oppnotconn');$('qt').style.display='';return}
  myRdy=true;mySeed=Math.floor(Math.random()*1e9)+1;

  $('go').style.display='none';setOS('waitready');$('qt').style.display='';
  check();
}
function check(){
  if((state!=='net'&&state!=='over')||mode!=='vs'||!myRdy||!opp||!meP||!opp.presence.rdy||typeof opp.presence.seed!=='number')return;
  var th=opp.presence,useMine=mySeed<=th.seed;
  var c=pickCfg({gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:cfgLocked?1:0,seed:mySeed},
                {gv:th.gv?1:0,it:th.it?1:0,sv:Number(th.sv)||0,lk:(th.lk===1||th.lk===true)?1:0,seed:th.seed});
  beginCount(useMine?mySeed:th.seed,c);
}
/* Both clients run this with the same two inputs, so both end up with the same settings:
   locked settings win, then the newer change, then (very unlikely) the smaller seed. */
function pickCfg(a,b){
  if(a.lk!==b.lk)return a.lk?a:b;
  if(a.sv!==b.sv)return a.sv>b.sv?a:b;
  if(a.gv===b.gv&&a.it===b.it)return a;
  return a.seed<=b.seed?a:b;
}
var countTimer=null;
function beginCount(seed,c){

  push({gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:1});
  state='count';var n=3;
  overlay('matchstart',String(n),'',false);ovui(false);
  countTimer=setInterval(function(){
    if(state!=='count'||mode!=='vs'||!room){clearInterval(countTimer);countTimer=null;return;}
    n--;
    if(n>0){setOS(String(n));return}
    clearInterval(countTimer);countTimer=null;
    gs=seed;gravity=!!cfg.gv;itemMode=!!cfg.it;myRdy=false;sentG='';
    push({gs:gs,atk:0,iq:0,ik:'',dead:false,rdy:false,g:'',sc:0});

}
var joinToken=0;
function joinRoom(code){

    if(token!==joinToken){rm.leave().catch(function(){});return;}
    room=rm;mode='vs';state='net';
    if(rm.onLost)rm.onLost(connLost);
    rm.onPeers(onPeers);
    return rm.presence({rdy:false,dead:false,gs:0,atk:0,g:'',sc:0,gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:0,t:Date.now(),cc:myCC}).then(function(){
      resize();
      overlay('battleTitle',fm('roomwait',{c:code}),'ready',false);
      endMenu();$('go').style.display='none';
      onPeers({peers:rm.peers()});
    });
  }).catch(function(err){
    if(token!==joinToken)return;
    if(room){leaveRoom();}
    mode='solo';state='ready';resize();
    console.error(err);
    var em=err&&err.message;setOS(em?function(){return em}:'joinfail');
  }).finally(function(){if(token===joinToken)$('join').disabled=false;});
}
$('go').addEventListener('click',function(){
  if(state==='paused')resume();
  else if(mode==='cpu'&&state==='over')startCpu(cpuLvl);
  else if(mode==='vs'&&(state==='net'||state==='over'))ready();
  else{mode='solo';leaveRoom();resize();start()}
});
$('vs').addEventListener('click',function(){
  joinToken++;$('join').disabled=false;leaveRoom();mode='solo';state='ready';resize();
  overlay('battleTitle','battlesub','',false);
  ovui(false);$('netbox').hidden=false;
});
$('join').addEventListener('click',function(){
  var code=$('code').value.trim();
  if(!new RegExp('^\\d{'+ROOM_LEN+'}$').test(code)){setOS(fm('entercode',{n:ROOM_LEN}));return}
  roomCode=code;setOS('connecting');
  joinRoom(code);
});
$('back').addEventListener('click',function(){
  joinToken++;$('join').disabled=false;leaveRoom();mode='solo';state='ready';pendingScore=null;clearBoard();resize();
  overlay('tetris','drag','start',best>0);
});
function gvLabel(){$('gvc').checked=gravityPref;$('itmc').checked=itemPref;$('ghvc').checked=ghostPreview;$('sndc').checked=soundOn;$('musicvolc').value=musicVolume;$('musicvolvalue').textContent=musicVolume+'%'}
$('settings').addEventListener('click',function(){
  $('settingsbox').hidden=false;
  ['settings','cpub','vs','rk','go'].forEach(function(i){$(i).style.display='none'});
  gvLabel();
});
$('settingsback').addEventListener('click',function(){
  $('settingsbox').hidden=true;
  ['settings','cpub','vs','rk'].forEach(function(i){$(i).style.display=''});
  $('go').style.display=(state==='over'||state==='paused')?'':'none';
});
$('gvc').addEventListener('change',function(){
  gravityPref=this.checked;
  try{localStorage.setItem('tetris-gravity',gravityPref?'1':'0')}catch(e){}
  if(mode!=='vs')gravity=gravityPref;
});
$('itmc').addEventListener('change',function(){
  itemPref=this.checked;
  try{localStorage.setItem('tetris-items',itemPref?'1':'0')}catch(e){}
  if(mode!=='vs')itemMode=itemPref;
});
$('ghvc').addEventListener('change',function(){
  ghostPreview=this.checked;
  try{localStorage.setItem('tetris-ghost',ghostPreview?'1':'0')}catch(e){}
});
$('sndc').addEventListener('change',function(){
  soundOn=this.checked;
  try{localStorage.setItem('tetris-sound',soundOn?'1':'0')}catch(e){}
  if(soundOn){unlockAudio();tone(740,.16,'sine',.06);tone(980,.16,'triangle',.04,.12)}
});
$('musicvolc').addEventListener('input',function(){
  setMusicVolume(this.value);
  if(musicVolume>0)playMusic();else stopMusic();
});
gvLabel();
document.addEventListener('pointerdown',function(){unlockAudio();if(musicVolume>0)playMusic();});
['touchend','click'].forEach(function(n){document.addEventListener(n,function(){unlockAudio();if(musicVolume>0)playMusic();},{passive:true})});
document.addEventListener('keydown',function(){unlockAudio();if(musicVolume>0)playMusic();});
$('sndc').addEventListener('pointerdown',unlockAudio);
$('rs').addEventListener('click',function(){if(mode==='cpu')startCpu(cpuLvl);else{mode='solo';resize();start()}});
$('qt').addEventListener('click',function(){$('back').click()});
$('pause').addEventListener('click',function(){state==='playing'?pause():state==='paused'&&resume()});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){stopMusic();if(mode!=='vs')pause()}
  else if(musicVolume>0)playMusic();
});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200)});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme)}catch(e){}

function detectLang(){var pref='';try{pref=localStorage.getItem('tetris-language')||'auto'}catch(e){}LANG_PREF=pref;var raw=pref==='auto'?((navigator.languages&&navigator.languages[0])||navigator.language||'en'):pref;raw=String(raw).replace('_','-');if(raw.toLowerCase().indexOf('zh-tw')===0||raw.toLowerCase().indexOf('zh-hk')===0)return 'zh-TW';if(raw.toLowerCase().indexOf('zh')===0)return 'zh-CN';var key=raw.split('-')[0].toLowerCase();return I18N[key]?key:'en'}
function tr(key){return (I18N[LANG]&&I18N[LANG][key])||I18N.en[key]||key}
function applyLanguage(){
 LANG=detectLang();
 try{document.documentElement.lang=LANG}catch(e){}
 var sel=$('languageSelect');if(sel)sel.value=LANG_PREF;
 function txt(id,key){var el=$(id);if(el)el.textContent=tr(key)}
 function aria(el,key){if(el)el.setAttribute('aria-label',tr(key))}
 txt('settingstitle','settings');txt('languageLabel','language');
 [['gv','gravity'],['itm','items'],['rgv','gravity'],['rit','items'],['ghv','landing'],['snd','sound']].forEach(function(p){var el=$(p[0]),sp=el&&el.querySelector('span');if(sp)sp.textContent=tr(p[1])});
 txt('settingsback','back');txt('rs','restart');txt('qt','main');txt('vs','battle');txt('rk','ranking');txt('cpub','cpu');txt('join','join');txt('back','back');txt('lback','back');txt('nsave','save');txt('nskip','skip');txt('rstart','startgame');txt('rclose','close');
 txt('lvl','level');txt('lnl','lines');txt('itmhelp','itemhelp');
 var vol=$('musicvol');if(vol&&vol.querySelector('label span'))vol.querySelector('label span').textContent=tr('music');
 var opts=document.querySelectorAll('#lvbox button[data-l]');if(opts.length>=3){opts[0].textContent=tr('easy');opts[1].textContent=tr('normal');opts[2].textContent=tr('hard')}
 var ctl=document.querySelector('[data-act="rot"]');if(ctl)ctl.textContent=tr('rotate');ctl=document.querySelector('[data-act="drop"]');if(ctl)ctl.textContent=tr('drop');
 aria(document.querySelector('[data-act="left"]'),'left');aria(document.querySelector('[data-act="right"]'),'right');aria(document.querySelector('[data-act="down"]'),'down');
 var st=$('settings');if(st){st.setAttribute('aria-label',tr('settings'));st.title=tr('settings')}
 aria($('pause'),'pause');aria($('next'),'nextpiece');aria($('musicvolc'),'musicaria');aria($('cc'),'country');aria($('mf'),'country');
 $('languageSelect').querySelector('option[value="auto"]').textContent=tr('automatic');
 $('nick').placeholder=tr('nickname');aria($('nick'),'nickname');
 var codeTxt=fmt('roomcode',{n:ROOM_LEN});$('code').placeholder=codeTxt;$('code').setAttribute('aria-label',codeTxt);
 var rank=$('rank');if(rank){rank.setAttribute('aria-label',tr('ranking').replace('👑 ',''));var h=rank.querySelector('h2');if(h)h.textContent=tr('top')}
 initDN(LANG);fillCountries();
 olabel();
 renderOverlay();
}
$('languageSelect').addEventListener('change',function(){LANG_PREF=this.value;try{localStorage.setItem('tetris-language',LANG_PREF)}catch(e){}applyLanguage();});
applyLanguage();

grid=emptyGrid();
overlay('tetris','drag','start',best>0);
resize();hud();if(musicVolume>0)playMusic();
requestAnimationFrame(function(t){last=t;loop(t)});
})();
