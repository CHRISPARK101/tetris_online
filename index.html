<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>SLOT BATTLE V3 - Improved Feedback</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1220;
      color: #e8eaf0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 375px;
      height: 720px;
      background: #15192b;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 2px solid #2a2f45;
    }

    .top-bar {
      height: 52px;
      background: #1c2135;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #2a2f45;
      z-index: 10;
      position: relative;
    }

    .wave-strip { display:flex; align-items:center; gap:6px; }
    .wave-strip i { font-style:normal; }
    .ws-cur { background:#30275b; border:1px solid #8b75ff; border-radius:8px; padding:2px 8px; font-weight:800; color:#fff; white-space:nowrap; }
    .ws-cur.boss { background:#4a1d24; border-color:#f87171; }
    .ws-cur small { font-weight:500; color:#9aa3c0; font-size:10px; }
    .ws-next { color:#7a84a5; font-size:11px; }
    .ws-boss { color:#fca5a5; font-size:11px; white-space:nowrap; }
    .top-bar span {
      background: #252b42;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .main-area {
      height: calc(100% - 52px - 64px);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: filter 0.35s ease;
    }

    .main-area.dimmed {
      filter: brightness(0.5);
    }

    .battle-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a1f35 0%, #12162a 100%);
    }

    .battle-placeholder {
      text-align: center;
      opacity: 0.65;
    }

    .battle-placeholder .icon { font-size: 42px; margin-bottom: 8px; }
    .battle-placeholder p { font-size: 14px; color: #9aa3c0; }

    .unit-board {
      height: 90px;
      background: #1a1f33;
      border-top: 1px solid #2a2f45;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
    }

    .unit-board-label {
      font-size: 11px;
      color: #7a84a5;
      writing-mode: vertical-rl;
      margin-right: 4px;
      letter-spacing: 1px;
    }

    .unit-card {
      min-width: 62px;
      height: 70px;
      background: #252b42;
      border-radius: 10px;
      border: 1px solid #323a58;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      position: relative;
      animation: unitIn 0.35s ease;
    }

    .unit-card .name {
      font-size: 10px;
      color: #9aa3c0;
      margin-top: 2px;
    }

    .unit-card.new {
      border-color: #7b5cff;
      box-shadow: 0 0 10px rgba(123,92,255,0.45);
    }

    @keyframes unitIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .bottom-bar {
      height: 64px;
      background: #1c2135;
      border-top: 1px solid #2a2f45;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      position: relative;
    }

    .open-slot-btn {
      background: linear-gradient(135deg, #5b6cff, #7b5cff);
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(91,108,255,0.35);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 25;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .slot-panel {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 68%;
      background: #1a1f35;
      border-radius: 22px 22px 0 0;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 30;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 36px rgba(0,0,0,0.5);
    }
    .slot-panel.open { transform: translateY(0); }

    .panel-handle {
      width: 36px; height: 4px;
      background: #3a415c;
      border-radius: 4px;
      margin: 10px auto 4px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 18px 10px;
      font-size: 13px;
      color: #9aa3c0;
    }

    .close-btn {
      background: #2a2f45;
      border: none;
      color: #c5cbe0;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
    }

    .slot-body {
      display: flex;
      padding: 0 12px 0 16px;
      gap: 12px;
      flex: 1;
    }

    .slot-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-content: start;
    }

    .slot-cell {
      aspect-ratio: 1;
      background: #252b42;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border: 2px solid #323a58;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .slot-cell.spinning {
      animation: cellSpin 0.45s ease;
    }

    .slot-cell.matched {
      border-color: #a78bfa;
      box-shadow: 0 0 18px rgba(167,139,250,0.75), 0 0 40px rgba(167,139,250,0.35);
      transform: scale(1.08);
      background: linear-gradient(145deg, #4c3d7a, #2a2548);
      animation: matchPulse 0.6s ease;
    }

    @keyframes cellSpin {
      0% { transform: scale(1); }
      35% { transform: scale(0.78) rotate(-10deg); }
      100% { transform: scale(1); }
    }

    @keyframes matchPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.15); }
      100% { transform: scale(1.08); }
    }

    .slot-cell.line-glow {
      box-shadow: 0 0 22px rgba(251,191,36,0.8);
      border-color: #fbbf24;
    }

    .phone.shake {
      animation: phoneShake 0.45s ease;
    }
    @keyframes phoneShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-0.5deg); }
      40% { transform: translateX(6px) rotate(0.5deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* 사이드 슬라이드 바 - 위에서 아래로 */
    .slide-bar-wrap {
      width: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .slide-label {
      font-size: 11px;
      color: #7a84a5;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
    }

    .slide-track {
      width: 36px;
      height: 180px;
      background: #12162a;
      border-radius: 20px;
      border: 2px solid #2a2f45;
      position: relative;
      overflow: hidden;
    }

    .slide-fill {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 0%;
      background: linear-gradient(180deg, #5b6cff, #7b5cff);
      border-radius: 16px 16px 0 0;
      transition: height 0.05s linear;
    }

    .slide-thumb {
      position: absolute;
      left: 3px; right: 3px;
      height: 42px;
      background: #e8eaf0;
      border-radius: 14px;
      top: 4px;          /* 기본 위치: 위쪽 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #1a1f35;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: grab;
      touch-action: none;
      transition: top 0.05s linear;
    }

    .slide-thumb:active { cursor: grabbing; }

    .slide-hint {
      font-size: 10px;
      color: #5a6480;
      text-align: center;
      line-height: 1.3;
    }

    .result-area {
      padding: 10px 16px 16px;
      min-height: 70px;
    }

    .spin-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #9aa3c0;
      margin-bottom: 8px;
    }

    .spin-info strong { color: #e8eaf0; }

    .summon-log {
      font-size: 13px;
      color: #c4b5fd;
      min-height: 20px;
      text-align: center;
    }

    .summon-log.success {
      animation: logPop 0.4s ease;
    }

    @keyframes logPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bottom-bar { gap: 10px; }
    .open-slot-btn { padding: 12px 26px; }
    .start-btn {
      background: #2a2f45; color: #e8eaf0; border: 1px solid #3a415c;
      padding: 12px 22px; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .start-btn:disabled { opacity: 0.45; cursor: default; }
    .battle-zone { position: relative; flex-direction: column; }
    .field { flex: 1; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; }
    .side { width: 46%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center; }
    .actor { width: 44px; text-align: center; }
    .actor .ico { font-size: 26px; transition: transform 0.1s; }
    .hp { height: 4px; background: #12162a; border-radius: 2px; overflow: hidden; margin-bottom: 2px; }
    .hp i { display: block; height: 100%; background: #4ade80; }
    .foe .hp i { background: #f87171; }
    .ally.hit .ico { transform: translateX(-5px); filter: brightness(2); }
    .foe.hit .ico { transform: translateX(5px); filter: brightness(2); animation: foeImpact .24s ease; }
    .ally.attack .ico { animation: allyStrike .28s ease-in-out; filter: brightness(1.35) drop-shadow(0 0 7px rgba(96,165,250,.9)); }
    @keyframes allyStrike { 0% { transform:translateX(0) scale(1); } 45% { transform:translateX(13px) scale(1.18); } 100% { transform:translateX(0) scale(1); } }
    @keyframes foeImpact { 0%,100% { transform:translateX(0); } 30% { transform:translateX(5px) scale(1.12); } 65% { transform:translateX(-4px); } }
    .battle-msg { font-size: 12px; color: #9aa3c0; text-align: center; padding: 8px 14px 12px; min-height: 40px; }
    .unit-card { animation: none; }
    .unit-card.new { animation: unitIn 0.35s ease; }

    .slot-cell { cursor: pointer; }
    .slot-cell.rolling { filter: blur(1.5px); border-color: #5b6cff; }
    .unit-card { cursor: pointer; }
    .unit-card.sel { border-color: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.5); }
    .unit-card .lv { font-size: 9px; color: #fbbf24; min-height: 11px; }

    .top-bar { padding: 0 8px; font-size: 12px; }
    .top-bar span { padding: 4px 8px; }
    .top-bar span span { padding: 0; background: none; border-radius: 0; }
    .shop-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid #3a415c; background: #252b42; font-size: 20px; cursor: pointer; }
    .shop-tabs { display: flex; gap: 8px; padding: 0 16px 8px; }
    .tab { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #323a58; background: #252b42; color: #9aa3c0; font-weight: 700; font-size: 13px; cursor: pointer; }
    .tab.on { background: #5b6cff; color: #fff; border-color: #5b6cff; }
    .shop-msg { font-size: 12px; color: #c4b5fd; text-align: center; min-height: 18px; padding: 0 16px 6px; }
    .shop-list { flex: 1; overflow-y: auto; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; }
    .shop-row { display: flex; align-items: center; gap: 10px; background: #252b42; border: 1px solid #323a58; border-radius: 12px; padding: 10px 12px; }
    .shop-row .info { flex: 1; font-size: 13px; }
    .shop-row .info small { display: block; color: #7a84a5; font-size: 11px; margin-top: 2px; }
    .buy { background: #7b5cff; color: #fff; border: none; border-radius: 16px; padding: 8px 12px; font-weight: 700; font-size: 13px; cursor: pointer; min-width: 68px; }
    .buy:disabled { opacity: 0.4; cursor: default; }
    .inf { position: absolute; top: -2px; right: -2px; padding: 4px 6px; font-size: 10px; font-style: normal; color: #7a84a5; }
    .lk { position: absolute; top: 2px; left: 4px; font-size: 9px; font-style: normal; }
    .result-screen { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; }
    .result-screen.show { display: flex; }
    .rs-card { background: #1a1f35; border: 1px solid #3a415c; border-radius: 18px; padding: 24px 28px; text-align: center; }
    .rs-card h2 { margin-bottom: 10px; } .rs-card p { color: #9aa3c0; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
    .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .pop { position: absolute; font-weight: 800; font-size: 14px; animation: popUp 0.7s ease-out forwards; text-shadow: 0 1px 3px #000; }
    @keyframes popUp { to { transform: translateY(-30px); opacity: 0; } }
    .tab { font-size: 12px; padding: 8px 4px; }
    .rs-card .shop-list { min-width: 250px; }

    /* ===== V2 MOBILE REBUILD ===== */
    :root { color-scheme: dark; }
    html, body { width:100%; height:100%; min-height:100%; }
    body {
      min-height:100dvh; height:100dvh; padding:0;
      background: radial-gradient(ellipse at 50% 0%, #202b4d 0%, #0b1020 62%);
      overscroll-behavior:none;
    }
    .phone {
      width:min(100vw, 480px);
      height:100dvh; max-height:100dvh;
      border:0; border-radius:0;
      display:flex; flex-direction:column;
      box-shadow:none;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .top-bar { flex:0 0 48px; height:48px; gap:4px; padding:0 7px; font-size:clamp(10px,2.8vw,12px); }
    .top-bar > span { padding:5px 6px; white-space:nowrap; }
    .main-area { height:auto; flex:1; min-height:0; }
    .battle-zone { min-height:0; overflow:hidden; }
    .field {
      min-height:0;
      padding:8px 7px;
      gap:6px;
      display:grid;
      grid-template-columns:minmax(0, 1.75fr) minmax(88px, 1fr);
      align-items:stretch;
    }
    .field .ally-side {
      position:relative;
      width:auto;
      min-width:0;
      min-height:100%;
      height:100%;
      padding:22px 4px 8px;
      border:1px dashed rgba(91,108,255,.28);
      border-radius:12px;
      background:linear-gradient(135deg,rgba(91,108,255,.075),rgba(30,41,75,.12));
      overflow:hidden;
    }
    .field .enemy-side {
      position:relative;
      width:auto;
      min-width:0;
      min-height:100%;
      height:100%;
      display:flex;
      flex-wrap:wrap;
      gap:clamp(3px,1vw,7px);
      justify-content:center;
      align-content:center;
      align-items:center;
      padding:8px 2px;
      border-left:1px solid rgba(248,113,113,.16);
    }
    .actor { width:clamp(36px,10vw,52px); }
    .actor .ico { font-size:clamp(23px,7vw,34px); line-height:1.2; }
    .hp { height:5px; }
    .battle-msg { min-height:38px; max-height:52px; overflow:auto; padding:7px 10px; }
    .unit-board { flex:0 0 88px; height:88px; min-height:88px; padding:7px 9px; gap:7px; }
    .unit-card { min-width:58px; height:70px; }
    .bottom-bar { flex:0 0 64px; height:64px; gap:7px; padding:0 8px; }
    .open-slot-btn { flex:1; min-width:0; padding:12px 8px; font-size:14px; }
    .start-btn { padding:11px 10px; font-size:13px; white-space:nowrap; }
    .shop-btn { flex:0 0 44px; width:44px; height:44px; }
    .slot-panel { height:min(78%, 690px); height:min(78dvh, 690px); padding-bottom:env(safe-area-inset-bottom); }
    .shop-panel { height:min(76dvh, 650px); }
    .slot-body { min-height:0; align-items:center; gap:10px; padding:0 12px; }
    .slot-grid { max-width:min(70vw, 330px); gap:clamp(5px,1.6vw,9px); }
    .slot-cell { min-width:0; font-size:clamp(23px,7vw,34px); border-radius:clamp(8px,2.5vw,13px); }
    .slide-bar-wrap { flex:0 0 44px; width:44px; }
    .slide-track { height:min(31vh, 210px); height:min(31dvh, 210px); width:34px; }
    .result-area { padding:8px 12px calc(12px + env(safe-area-inset-bottom)); }
    .rs-card { width:min(90%, 360px); max-height:85%; overflow:auto; padding:22px 18px; }
    .shop-list { overscroll-behavior:contain; }
    button { touch-action:manipulation; }
    .actor.hit .ico { animation: hitFlash .16s ease; }
    @keyframes hitFlash { 50% { transform:scale(1.2); filter:brightness(2.2); } }
    .actor.foe .ico { filter:drop-shadow(0 2px 5px rgba(248,113,113,.25)); }
    .actor.swift .ico { filter:drop-shadow(0 0 6px rgba(96,165,250,.8)); }
    .actor.tank .ico { filter:drop-shadow(0 0 7px rgba(251,191,36,.7)); transform:scale(1.08); }
    .actor.caster .ico { filter:drop-shadow(0 0 7px rgba(192,132,252,.8)); }
    .actor.boss .ico { font-size:clamp(31px,9vw,42px); filter:drop-shadow(0 0 9px rgba(248,113,113,.9)); }
    .actor.ally .ico { filter:drop-shadow(0 2px 5px rgba(74,222,128,.18)); }
    .slot-cell.matched { background:linear-gradient(145deg,#3b3265,#252b42); }
    .slot-panel, .shop-panel { overscroll-behavior:contain; }
    .board-tools { writing-mode:horizontal-tb; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:52px; margin:0; letter-spacing:0; }
    .absorb-toggle { border:1px solid #6d5ce7; background:#29234b; color:#d9d2ff; border-radius:8px; padding:5px 6px; font-size:9px; font-weight:800; white-space:nowrap; transition: all 0.2s; }
    .absorb-toggle.on { background:#6d5ce7; color:#fff; box-shadow:0 0 12px #6d5ce7aa; transform: scale(1.05); }
    .absorb-toggle:not(.on) { animation: absorbHint 2s ease-in-out infinite; }
    @keyframes absorbHint { 0%,100%{ box-shadow:0 0 0 transparent; } 50%{ box-shadow:0 0 8px #6d5ce766; } }
    .unit-card { touch-action:pan-y; }
    .unit-card.drag-source { opacity:.55; transform:scale(.94); }
    .unit-card.drop-target { border-color:#4ade80; box-shadow:0 0 12px #4ade8088; }
    .unit-board.absorb-mode .unit-card:not(.locked) { border-color:#7668cb; }
    .unit-board.absorb-mode .unit-card { touch-action:none; }
    .unit-card.locked { opacity:.72; }
    .absorb-hint { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 4px); font-size:10px; color:#c4b5fd; white-space:nowrap; pointer-events:none; }
    #absorbChoice { z-index:60; }
    #absorbChoice .rs-card { text-align:left; }
    #absorbChoice .rs-card h2, #absorbChoice .rs-card p { text-align:center; }
    .trait-choice-list { display:flex; flex-direction:column; gap:8px; width:100%; }
    .trait-choice { width:100%; border:1px solid #465078; border-radius:10px; padding:11px 12px; background:#252b42; color:#e8eaf0; text-align:left; font-size:13px; }
    .trait-choice small { display:block; color:#9aa3c0; margin-top:3px; }
    .trait-choice.convert { border-color:#8b75ff; background:#30275b; }
    .trait-choice.cancel { border-color:#596078; background:#20263a; text-align:center; }
    @media (min-width:600px) {
      .phone { width:min(100vw,480px); border-left:1px solid #303958; border-right:1px solid #303958; }
    }
    @media (max-height:650px) {
      .top-bar { flex-basis:42px; height:42px; }
      .unit-board { flex-basis:76px; height:76px; min-height:76px; }
      .bottom-bar { flex-basis:58px; height:58px; }
      .slide-track { height: min(25dvh,150px); }
      .slot-panel { height:84dvh; }
    }

  
    .dtab{flex:1;padding:8px 4px;border-radius:10px;border:1px solid #323a58;background:#252b42;color:#9aa3c0;font-weight:700;font-size:12px;cursor:pointer}
    .dtab.on{background:#5b6cff;color:#fff;border-color:#5b6cff}
    .lb-diff{display:flex;gap:6px;margin-bottom:10px}
    #lobby .rs-card{text-align:left} #lobby .rs-card h2,#lobby .rs-card p{text-align:center}
    .actor.elite .ico{filter:drop-shadow(0 0 6px #fbbf24)}

<body>
  <div class="phone">
    <div class="top-bar">
      <span>💰 <span id="gold">900</span></span>
      <span>🔷 <span id="essence">0</span></span>

    <div class="main-area" id="mainArea">

        <div class="field" id="field"></div>

    </div>

    <div class="bottom-bar">
      <button class="open-slot-btn" id="openBtn">슬롯 열기</button>

      <button class="shop-btn" id="shopBtn">🛒</button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="slot-panel shop-panel" id="shopPanel">
      <div class="panel-handle"></div>
      <div class="panel-header"><span>SHOP · 🔷 <b id="essShop">0</b> · 💎 <b id="rubyShop">0</b></span><button class="close-btn" id="shopClose">✕</button></div>
      <div class="shop-tabs">
        <button class="tab on" data-tab="items">아이템</button>
        <button class="tab" data-tab="upg">업그레이드</button>
        <button class="tab" data-tab="dex">도감</button>
      </div>
      <div class="shop-msg" id="shopMsg"></div>
      <div class="shop-list" id="shopList"></div>
    </div>

    <div class="slot-panel shop-panel" id="detailPanel">
      <div class="panel-handle"></div>
      <div class="panel-header"><span>UNIT DETAIL</span><button class="close-btn" id="detailClose">✕</button></div>
      <div class="shop-msg" id="detailMsg"></div>
      <div class="shop-list" id="detailBody"></div>
    </div>

    <div class="result-screen" id="absorbChoice">
      <div class="rs-card">
        <h2 id="absorbChoiceTitle">✨ 특성 계승</h2>
        <p id="absorbChoiceText">희생 유닛의 특성을 선택하세요.</p>
        <div class="trait-choice-list" id="absorbChoiceList"></div>
      </div>
    </div>

    <div class="result-screen" id="resultScreen">
      <div class="rs-card"><h2 id="rsTitle">GAME OVER</h2><p id="rsText"></p><button class="start-btn" id="rsNext" style="display:none">다음 스테이지</button> <button class="start-btn" id="rsBtn">다시 시작</button> <button class="start-btn" id="rsUpg">🔮 업그레이드</button> <button class="start-btn" id="rsLobby">로비</button></div>
    </div>

    <div class="result-screen" id="coreScreen">
      <div class="rs-card"><h2 id="coreTitle">Core 선택</h2><p id="coreSub">이번 판의 규칙을 바꿔요</p><div id="coreList" class="shop-list"></div></div>
    </div>

    <div class="result-screen show" id="lobby">
      <div class="rs-card"><h2>🎰 SLOT BATTLE</h2><p id="lbText"></p><div class="lb-diff" id="lbDiff"></div><div class="shop-list" id="lbStages"></div></div>
    </div>

    <div class="jp-fx" id="jpFx"></div>

    <div class="slot-panel" id="slotPanel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <span>SLOT MACHINE</span>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>

      <div class="slot-body">
        <div class="slot-grid" id="slotGrid">
          <div class="slot-cell" data-idx="0">🗡️</div>
          <div class="slot-cell" data-idx="1">🏹</div>
          <div class="slot-cell" data-idx="2">🔮</div>
          <div class="slot-cell" data-idx="3">🗡️</div>
          <div class="slot-cell" data-idx="4">🛡️</div>
          <div class="slot-cell" data-idx="5">🏹</div>
          <div class="slot-cell" data-idx="6">🔮</div>
          <div class="slot-cell" data-idx="7">🗡️</div>
          <div class="slot-cell" data-idx="8">🏹</div>
        </div>

        <!-- 사이드 슬라이드 바 : 위에서 아래로 -->
        <div class="slide-bar-wrap">
          <div class="slide-label">PULL</div>
          <div class="slide-track" id="slideTrack">
            <div class="slide-fill" id="slideFill"></div>
            <div class="slide-thumb" id="slideThumb">↓</div>
          </div>
          <div class="slide-hint">아래로<br>내리세요</div>
        </div>
      </div>

      <div class="result-area">
        <div class="spin-info">
          <div>비용 <strong id="costEl">100</strong></div>
          <div>남은 횟수 <strong id="remainSpin">5</strong></div>
        </div>
        <div class="summon-log" id="summonLog">슬라이드 바를 아래로 내려 스핀하세요</div>
      </div>

  </div>

  <script>
    const BENCH_MAX = 3; // 자유 배치 (Slotbound: 줄 구분 없음, 배열 순서가 앞→뒤)
    const SPIN_COST = 100, NUDGE_COST = 40, MAX_UNITS = 5, MAX_LV = 60;

    // 심볼 = 유닛 원형 데이터 (hp / atk / spd = 공격 간격(초))
    // 릴 심볼 = 계열(7종, Slotbound와 동일). 같은 계열에서 등급(일반/고급/희귀/전설/프리즘)별 별개 유닛이 소환됨
    const SYMBOLS = [
      { icon: '🗡️', name: 'Warrior',  weight: 22, hp: 60, atk: 8,  spd: 1.0,  melee: true },
      { icon: '🏹', name: 'Archer',   weight: 22, hp: 35, atk: 10, spd: 0.8 },
      { icon: '🔱', name: 'Spearman', weight: 18, hp: 85, atk: 6,  spd: 1.15, melee: true },
      { icon: '🔮', name: 'Mage',     weight: 16, hp: 30, atk: 14, spd: 1.5 },
      { icon: '🐴', name: 'Cavalry',  need: 3, weight: 12, hp: 70, atk: 12, spd: 1.0, melee: true },
      { icon: '🤺', name: 'Duelist',  need: 4, weight: 12, hp: 55, atk: 9,  spd: 0.9, melee: true },
      { icon: '⭐', name: 'Special',  need: 6, weight: 10, hp: 50, atk: 16, spd: 1.0 },
      { icon: '🌈', name: 'Prism',    need: 3, weight: 3,  prism: true, hp: 0, atk: 0, spd: 1 }, // 와일드: 줄을 완성하면 전설/프리즘 유닛
    ];
    const TORDER = ['n', 'a', 'r', 'l', 'p'];
    const TNAME = { n: '일반', a: '✨ 고급', r: '💠 희귀·특수', l: '🌈 전설', p: '🔶 프리즘' };
    const TMUL = { n: 1, a: 1.35, r: 1.8, l: 2.6, p: 3.6 }; // 등급별 기본 능력치 배율
    const UNITS = { // [아이콘, 이름]
      Warrior:  { n: ['🗡️', 'Warrior'],  a: ['🔨', 'Mace Soldier'], r: ['🥋', 'Fighter'],      l: ['☠️', 'Skull Fighter'],    p: ['🪓', 'Slayer'] },
      Archer:   { n: ['🏹', 'Archer'],   a: ['🔭', 'Scout'],        r: ['🔫', 'Gunslinger'],   l: ['💀', 'Skeleton Archer'],  p: ['🎯', 'Sharpshooter'] },
      Spearman: { n: ['🔱', 'Spearman'], a: ['⚔️', 'Infantry'],     r: ['🤾', 'Spear Fighter'], l: ['🦴', 'Bone Spearman'],    p: ['🧚', 'Lancer'] },
      Mage:     { n: ['🔮', 'Mage'],     a: ['🧙', 'Sorcerer'],     r: ['🪄', 'Arcanist'],     l: ['🧟', 'Bone Mage'],        p: ['📕', 'Forbidden Mage'] },
      Cavalry:  { n: ['🐴', 'Cavalry'],  a: ['🐎', 'Iron Cavalry'], r: ['🦄', 'Light Cavalry'], l: ['🎠', 'Dread Cavalry'],    p: ['🐗', 'Beast Cavalry'] },
      Duelist:  { n: ['🤺', 'Duelist'],  a: ['🌳', 'Druid'],        r: ['🛡️', 'Guardian'],     l: ['👤', 'Shade'],            p: ['👼', 'Angel'] },
      Special:  { r: ['🤡', 'Jester'] },
    };
    function rollTier(min) {
      const w = (G && G.wave) || 1, rs = k => 1 + 0.3 * hasN(k + 'R1') + 0.4 * hasN(k + 'R2');
      const wt = { n: Math.max(40, 80 - w * 0.8), a: has('advUnlock') ? (14 + w * 0.3) * rs('adv') : 0, r: has('rareUnlock') && w >= 3 ? (3 + w * 0.3) * rs('rare') : 0, l: has('legUnlock') && w >= 6 ? (0.8 + w * 0.12) * rs('leg') : 0, p: has('prismUnlock') && w >= 10 ? (0.2 + w * 0.05) * rs('prism') : 0 };
      const ok = TORDER.filter(t => TORDER.indexOf(t) >= TORDER.indexOf(min || 'n') && (wt[t] > 0 || t === 'n')), tot = ok.reduce((a, t) => a + wt[t], 0);
      let r = Math.random() * tot; for (const t of ok) { r -= wt[t]; if (r <= 0) return t; } return ok[ok.length - 1];
    }
    const PAYLINES = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    // 게임 상태는 한 객체로 관리 (phase: prep / fight / over)
    const G = { stage: 0, diff: 0, gold: 0, spins: 0, wave: 1, baseHp: 100, phase: 'prep', spinning: false, units: [], bench: [], enemies: [], minions: [] };

    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const slotPanel = document.getElementById('slotPanel');
    const overlay = document.getElementById('overlay');
    const mainArea = document.getElementById('mainArea');
    const cells = document.querySelectorAll('.slot-cell');
    const unitBoard = document.getElementById('unitBoard');
    const summonLog = document.getElementById('summonLog');
    const goldEl = document.getElementById('gold');
    const unitCountEl = document.getElementById('unitCount');
    const remainSpinEl = document.getElementById('remainSpin');

    const slideTrack = document.getElementById('slideTrack');
    const slideThumb = document.getElementById('slideThumb');
    const slideFill = document.getElementById('slideFill');

    function openPanel() {
      slotPanel.classList.add('open');
      overlay.classList.add('show');
      mainArea.classList.add('dimmed');
    }
    function closePanel() {
      slotPanel.classList.remove('open');
      overlay.classList.remove('show');
      mainArea.classList.remove('dimmed');
      resetSlide();
    }

    openBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    // ========== 슬라이드 바 (위에서 아래로) ==========
    let dragging = false;
    let startY = 0;
    let currentPull = 0; // 0(위) ~ 1(아래)

    const TRACK_HEIGHT = 180;
    const THUMB_HEIGHT = 42;
    const MAX_TRAVEL = TRACK_HEIGHT - THUMB_HEIGHT - 8;

    function setPull(ratio) {
      ratio = Math.max(0, Math.min(1, ratio));
      currentPull = ratio;
      const top = 4 + ratio * MAX_TRAVEL;
      slideThumb.style.top = top + 'px';
      slideFill.style.height = (ratio * 100) + '%';
    }

    function resetSlide() {
      setPull(0);
      slideThumb.textContent = '↓';
    }

    function onStart(clientY) {
      if (G.spinning) return;
      dragging = true;
      startY = clientY;
      slideThumb.style.transition = 'none';
      slideFill.style.transition = 'none';
    }

    function onMove(clientY) {
      if (!dragging) return;
      const delta = clientY - startY; // 아래로 내리면 양수
      const ratio = delta / MAX_TRAVEL;
      setPull(ratio);
    }

    function onEnd() {
      if (!dragging) return;
      dragging = false;
      slideThumb.style.transition = 'top 0.2s ease';
      slideFill.style.transition = 'height 0.2s ease';

      if (currentPull >= 0.85 && doSpin()) {
        slideThumb.textContent = '✓';
      } else {
        resetSlide();
      }
    }

    // 마우스
    slideThumb.addEventListener('mousedown', e => {
      e.preventDefault();
      onStart(e.clientY);
    });
    window.addEventListener('mousemove', e => onMove(e.clientY));
    window.addEventListener('mouseup', onEnd);

    // 터치
    slideThumb.addEventListener('touchstart', e => {
      e.preventDefault();
      onStart(e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (dragging) {
        e.preventDefault();
        onMove(e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', onEnd);

    // ========== 유틸 / HUD ==========
    const $ = id => document.getElementById(id);
    const field = $('field'), battleMsg = $('battleMsg'), startBtn = $('startBtn');
    let timer = null;

    function say(t, ok) {
      summonLog.textContent = t;
      summonLog.classList.remove('success');
      if (ok) { void summonLog.offsetWidth; summonLog.classList.add('success'); }
    }
    function updateHud() {
      goldEl.textContent = G.gold;
      renderCoreBar();
      $('essence').textContent = G.essence | 0;
      remainSpinEl.textContent = G.spins;
      unitCountEl.textContent = G.units.length + (G.bench.length ? '+' + G.bench.length : '');
      { // 웨이브 표시: 현재 웨이브 / 다음 웨이브 / 가장 가까운 보스 웨이브
        const inf = G.stage < 0, mx = inf ? Infinity : waveMax(), w = G.wave;
        const isBoss = x => x % 5 === 0 || x === mx;
        let nb = w; while (nb <= (inf ? w + 5 : mx) && !isBoss(nb)) nb++;
        $('wave').innerHTML = `<i class="ws-cur${isBoss(w) ? ' boss' : ''}">${isBoss(w) ? '👹' : ''}W${w}<small>${inf ? ' ♾️' : '/' + mx}</small></i>` +
          (w < mx ? `<i class="ws-next">${w + 1}</i>` : '') +
          (nb > w && nb <= mx ? `<i class="ws-boss">👹${nb}</i>` : '');
      }
      $('baseHp').textContent = Math.max(0, Math.ceil(G.baseHp));
      $('ruby').textContent = META.ruby;
      $('costEl').textContent = spinCost();
      $('maxUnits').textContent = maxUnits();
    }

    // ========== 스핀 + 판정 + 소환 ==========
    function weightedRandom(noPrism) {
      const pool = SYMBOLS.filter(x => META.best >= (x.need || 0) && !(noPrism && x.prism) && !(x.prism && !has('legUnlock'))); // 최고 웨이브로 해금
      const w = x => x.weight * (hasCore('lucky') && x.name === 'Special' ? 2 : 1);
      let r = Math.random() * pool.reduce((a, x) => a + w(x), 0);
      for (const x of pool) { r -= w(x); if (r <= 0) return x; }
      return pool[0];
    }

    function drawGrid() { cells.forEach((c, i) => c.textContent = G.grid[i].icon); }

    // 현재 그리드의 매칭 판정 + 소환. 매칭된 줄 수를 반환

    const CLR = (s, d) => !!META.clear[s + '-' + d];
    const stageOpen = s => s === 0 || CLR(s - 1, 0);
    const diffOpen = (s, d) => stageOpen(s) && (d === 0 || CLR(s, d - 1));
    const infOpen = () => CLR(5, 0);
    const themeOf = () => G.stage >= 0 ? STAGES[G.stage] : STAGES[Math.floor((G.wave - 1) / 5) % 6];

    // ========== 로비 = 스테이지 선택 ==========
    let lbDiff = 0;
    function renderLobby() {
      $('lbText').textContent = `최고 기록 Wave ${META.best} · 💎 ${META.ruby}`;
      $('lbDiff').innerHTML = DIFFS.map((d, i) => `<button class="dtab${i === lbDiff ? ' on' : ''}" data-d="${i}">${d.n} · ${d.wv}웨이브</button>`).join('');
      $('lbStages').innerHTML = STAGES.map((s, i) => {
        const open = diffOpen(i, lbDiff), done = CLR(i, lbDiff);
        const why = !stageOpen(i) ? `${STAGES[i - 1].n} Easy 클리어 필요` : !open ? `${DIFFS[lbDiff - 1].n} 클리어 필요` : s.rule;
        return `<div class="shop-row"><div class="info">${open ? s.ic : '🔒'} ${i + 1}. ${s.n} ${done ? '✅' : ''}<small>${s.boss.ic} ${s.boss.n} · ${why}</small></div><button class="buy" data-s="${i}" ${open ? '' : 'disabled'}>${done ? '재도전' : '출전'}</button></div>`;
      }).join('') + `<div class="shop-row"><div class="info">${infOpen() ? '♾️' : '🔒'} 무한 모드<small>${infOpen() ? '끝없는 웨이브 · 5웨이브마다 보스' : '캠페인 완료(6스테이지 Easy 클리어) 필요'}</small></div><button class="buy" data-s="-1" ${infOpen() ? '' : 'disabled'}>도전</button></div>`;
    }
    function startRun(stage, diff) {

    $('lbStages').addEventListener('click', e => {

      const s = +b.dataset.s;

    });
    $('rsNext').addEventListener('click', () => { const n = G.stage + 1; $('resultScreen').classList.remove('show'); startRun(n, diffOpen(n, G.diff) ? G.diff : 0); });

    // ========== 웨이브 / 자동 전투 ==========
    function mkEnemy(icon, hp, atk, spd, role='grunt') {
      return { icon, maxHp: hp, hp, atk, spd, cd: spd, role, stun: 0, burn: 0, burnDps: 0 };
    }

    function startWave() {
      if (G.phase !== 'prep') return;
      if (!G.units.length) { battleMsg.textContent = G.bench.length ? '출전 유닛이 없어요. 예비 유닛을 필드로 드래그하세요' : '유닛이 없어요. 슬롯을 돌려 먼저 소환하세요'; return; }
      const w = G.wave, st = themeOf(), df = DIFFS[G.diff], inf = G.stage < 0;
      const sc = inf ? 1 + 0.08 * w : 1 + 0.15 * G.stage;
      const hp = (20 + w * 10) * sc * df.hp * (st.hpM || 1), atk = (2 + w * 1.2) * sc * df.atk;
      const count = Math.min(12, Math.max(2, Math.round((2 + Math.floor(w * 0.8)) * (st.cnt || 1))));
      const avail = Math.min(st.roster.length, 1 + Math.ceil(w / 3));
      const mk = (r, hm = 1, am = 1) => {
        const e = mkEnemy(r[0], Math.round(hp * r[1] * hm), Math.round(atk * r[2] * am * 10) / 10, Math.round(r[3] * (st.spdM || 1) * 100) / 100, r[4]);
        e.dr = (st.dr || 0) * (r[4] === 'tank' ? 1.5 : 1); e.dodge = st.dodge || 0;
        const wm = ((w - 1) % 10) + 1; if (wm >= 6 && wm <= 8 && r[4] === 'caster') e.splash = 0.35; // 10웨이브 주기 중 6~8: 광역 피해
        return e;
      };
      G.enemies = Array.from({ length: count }, (_, i) => mk(st.roster[(i + w - 1) % avail]));
      const tankR = st.roster.find(r => r[4] === 'tank') || st.roster[0];
      const last = inf ? -1 : waveMax(), pre = !inf && w === last - 1; // 마지막 웨이브 직전 = 전초전
      if (w % 5 === 4 && !pre) { const e = mk(tankR, 1.6, 1.3); e.elite = 1; G.enemies.push(e); }          // 보스 직전 웨이브: 강화 적
      if (pre) for (let i = 0; i < 2; i++) { const e = mk(tankR, 1.8, 1.3); e.elite = 1; G.enemies.push(e); } // 최종 보스 전초전
      const boss = inf ? w % 5 === 0 : (w % 5 === 0 || w === last);
      let bname = '';
      if (boss) {
        const mid = inf ? w % 10 === 5 : w !== last;
        const b = mkEnemy(st.boss.ic, hp * (mid ? 2.6 : 4.2), atk * (mid ? 1.3 : 1.6), 1.5, 'boss');
        bname = (mid ? '수문장 ' : '') + st.boss.n;
        Object.assign(b, { boss: st.boss.k, bi: mid ? 9 : 6.5, bs: mid ? 9 : 6.5, pow: mid ? 0.7 : 1, bname, dr: st.dr || 0, dodge: st.dodge || 0 });
        G.enemies.push(b);
      }
      G.units.forEach(u => { u.rv2 = false; u.rvT = 0; u.bu = false; u.od = false; u.hits = 0; u.rev = false; u.fs = !!u.firstS; u.sh = u.shieldP ? u.maxHp * u.shieldP : 0; if (u.firstS) u.cd = 0;
        u.exploded = false; u.ghost = false; u.ghosted = false; u.big = 0; u.rel = 0; u.lastT = null; u.ov = 0; u.ovB = 0; u.cb = 0;
        });
      G.lostThisWave = false;
      if (has('interest')) { const gi = Math.min(50, Math.floor(G.gold / 100) * (10 + 3 * iLv('p_int'))); if (gi > 0) { G.gold += gi; battleMsg.textContent = `📈 전술적 이자 +${gi} 골드`; } }
      G.enemies.forEach((e, i) => { e.ex = Math.floor(i / 4); e.ey = (i % 4) + (Math.floor(i / 4) % 2) * 0.5; }); // 적 논리 좌표
      G.minions = G.minions.filter(m => m.persist && !boss); // 보스 추종자는 다음 보스전까지 유지
      G.minions.forEach(m => { m.hp = m.maxHp; m.cd = 0.6; });
      G.units.forEach(u => { const I = u.iL || {}; if (I.clone) spawnClone(u); if (I.colossus) spawnColossus(u); });
      const maj = Math.max(0, ...G.units.map(u => (u.iL && u.iL.majesty) || 0));
      if (maj) G.enemies.forEach(e => { e.atk *= 1 - lerp(maj, 0.12, 0.42); const k = 1 - lerp(maj, 0.15, 0.45); e.maxHp *= k; e.hp *= k; }); // 위엄
      G.phase = 'fight'; sel = -1;
      startBtn.disabled = true;
      const tag = boss ? `⚠ ${bname}` : pre ? '보스 전초전' : w % 5 === 4 ? '강화 적 출현' : '';
      battleMsg.textContent = `${st.ic} ${st.n} · Wave ${w} ${tag}`.trim() + (w === 1 ? ` · ${st.rule}` : '');
      renderField();
      timer = setInterval(tick, 100);
    }

    function bossAct(e, now) {
      const p = e.pow, k = e.boss;
      const hitAll = m => { G.units.forEach(u => hurt(u, e.atk * m * p, null)); pop(e.atk * m * p, 'L', '#fb923c'); };
      const spawn = (ic, n) => { for (let i = 0; i < n && G.enemies.length < 12; i++) { const m = mkEnemy(ic, Math.round(e.maxHp * 0.08), Math.round(e.atk * 0.5 * 10) / 10, 0.7, 'swift'); m.dr = 0; m.dodge = 0; G.enemies.push(m); } };
      if (k === 'forest') spawn('🐺', 2);
      else if (k === 'worm') e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.1 * p);
      else if (k === 'slam') hitAll(0.9);
      else if (k === 'ruler') { e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.06 * p); const t = G.units[Math.floor(Math.random() * G.units.length)]; if (t) t.stun = 1.5; }
      else if (k === 'rain') hitAll(0.8);
      else if (k === 'rift') { G.units.forEach(u => u.stun = 1); hitAll(0.5); spawn('👽', 1); }
      battleMsg.textContent = `⚠ ${e.bname} · ${BOSS_SKILL[k]}!`;
    }

    function stageClear() {
      G.phase = 'over';
      const s = G.stage, d = G.diff, first = !CLR(s, d);
      const rb = Math.round((20 + 6 * s) * DIFFS[d].rw * (first ? 2 : 0.5));
      META.ruby += rb; G.runRuby += rb; META.clear[s + '-' + d] = 1; saveMeta();
      const notes = [];
      if (first) {
        if (d < 2) notes.push(`${DIFFS[d + 1].n} 난이도 해금`);
        if (d === 0 && s < 5) notes.push(`${STAGES[s + 1].n} 해금`);
        if (d === 0 && s === 5) notes.push('♾️ 무한 모드 해금');
      }
      $('rsTitle').textContent = '🏆 STAGE CLEAR';
      $('rsText').innerHTML = `${STAGES[s].n} (${DIFFS[d].n}) 클리어!<br>${STAGES[s].boss.n} 처치 · 💎 +${rb}${first ? ' (최초 보너스)' : ''}<br>${notes.join(' · ') || '&nbsp;'}`;
      const next = s < 5 && stageOpen(s + 1);
      $('rsNext').style.display = next ? '' : 'none';
      $('rsBtn').textContent = '재도전';
      startBtn.textContent = '다시 시작'; startBtn.disabled = false;
      battleMsg.textContent = `🏆 ${STAGES[s].n} 클리어!`;
      updateRsUpg();
      $('resultScreen').classList.add('show');
      updateHud();
    }

    let lastFieldRender = 0;
    // 적 논리 좌표(ex: 뒤쪽일수록 큼, ey: 세로). '주변/가장 가까운/뒤쪽' 판정에 사용
    const edist = (a, b) => Math.hypot((a.ex || 0) - (b.ex || 0), (a.ey || 0) - (b.ey || 0));
    const liveE = () => G.enemies.filter(x => x.hp > 0);
    const nearEnemies = (c, r, n) => liveE().filter(x => x !== c && edist(x, c) <= r).sort((a, b) => edist(a, c) - edist(b, c)).slice(0, n);
    const nearestOthers = (c, n, skip) => liveE().filter(x => x !== c && !(skip || []).includes(x)).sort((a, b) => edist(a, c) - edist(b, c)).slice(0, n);
    const behindE = (c, n) => liveE().filter(x => x !== c && (x.ex > c.ex || (x.ex === c.ex && x.ey > c.ey))).sort((a, b) => edist(a, c) - edist(b, c)).slice(0, n);
    const hitFx = (e, d, col, now) => { const x = d * (1 - (e.dr || 0)) * (e.soul > 0 ? 2 : 1); e.hp -= x; e.hitAt = now || performance.now(); pop(x, 'R', col || '#a78bfa'); return x; };
    function spawnMinion(o) { const m = Object.assign({ mn: true, hp: 1, maxHp: 1, atk: 1, spd: 1, cd: 0.6, sh: 0, fx: 50, fy: 50 }, o); m.hp = m.maxHp; G.minions.push(m); return m; }
    const nearOwner = u => ({ fx: Math.max(5, Math.min(95, (u.fx || 50) + (Math.random() * 16 - 8))), fy: Math.max(10, Math.min(90, (u.fy || 50) + (Math.random() * 20 - 10))) });
    function spawnClone(u) { const r = lerp(u.iL.clone, 0.4, 0.95); spawnMinion(Object.assign({ kind: 'clone', owner: u, icon: u.icon, name: '분신', maxHp: Math.round(u.maxHp * r), atk: u.atk * r, spd: u.spd * u.spdM }, nearOwner(u))); }
    function spawnColossus(u) {
      const c = u.iL.colossus; spawnMinion(Object.assign({ kind: 'colossus', owner: u, icon: '🗿', name: '거신', maxHp: Math.round(u.maxHp * lerp(c, 2, 4)), atk: u.atk * lerp(c, 0.4, 0.9), spd: 1.4 }, nearOwner(u)));
      if (c >= 5) liveE().forEach(e => { e.stun = Math.max(e.stun || 0, 0.8); e.kb = 70; e.kbT = 0.8; }); // LV5: 소환 시 적을 밀쳐내고 기절
    }
    // 기지 피격: 초보자 방패 / 재도전 보급 / 역전 레버
    function baseHit(d) {
      if (has('noviceShield') && !G.nsUsed && G.wave <= 4) { G.nsUsed = true; battleMsg.textContent = '🛡️ 초보자 방패가 기지 피해를 막았어요'; return; }
      G.baseHp -= d;
      if (!G.lostThisWave) {
        G.lostThisWave = true;
        if (has('retry1')) { G.gold += has('retry2') ? 150 : 100; battleMsg.textContent = `🔁 재도전 보급 +${has('retry2') ? 150 : 100} 골드`; }
        if (has('comeback') && !G.cbUsed) { G.cbUsed = true; G.cbSpin = true; battleMsg.textContent = '🎰 역전 레버: 다음 스핀은 반드시 당첨!'; }
      }
    }
    function tick() {
      const dt = 0.1, now = performance.now(), st = themeOf();
      G.units.forEach(u => {
        if (u.regen) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * u.regen * dt);
        if (u.cloneT > 0) { u.cloneT -= dt; if (u.cloneT <= 0 && u.hp > 0 && u.iL && u.iL.clone) spawnClone(u); }
        if (u.rvT > 0) u.rvT -= dt;
        if (u.big > 0) u.big -= dt;
        if (u.stun > 0) { u.stun -= dt; return; } // 기절: 행동 불가
        u.cd -= dt;
        if (u.cd <= 0 && G.enemies.some(e => e.hp > 0)) {
          // 각 유닛은 독립적인 공격 주기를 유지합니다. 먼저 쓰러질 적을 집중 공격하고,
          // 해당 적이 쓰러지면 같은 틱의 다음 유닛은 살아 있는 다음 적을 공격합니다.
          const living = G.enemies.filter(e => e.hp > 0);
          const target = living.reduce((best, e) => (e.hp / e.maxHp < best.hp / best.maxHp ? e : best), living[0]);
          target.hitAt = now; u.attackAt = now; u.cd = u.spd * u.spdM / (1 + (u.rel || 0) * (u.iL && u.iL.relentless ? lerp(u.iL.relentless, 0.04, 0.06) : 0));
          if (Math.random() < (target.dodge || 0)) pop(0, 'R', '#9aa3c0'); // 회피
          else {
            // 자유 배치: 근접 유닛이 뒤쪽(fx 낮음)에 있으면 약간의 페널티
            const backPenalty = (u.melee && (u.fx || 50) < 40) ? 0.75 : 1;
            let dmg = u.atk * (1 - (target.dr || 0)) * backPenalty;
            if (u.rage) dmg *= 1 + u.rage * (1 - u.hp / u.maxHp);
            if (u.exec && target.hp / target.maxHp < 0.3) dmg *= 1 + u.exec;
            if (u.fs) { dmg *= 2; u.fs = false; }
            const crit = u.crit && Math.random() < u.crit; if (crit) dmg *= 2;
            const I = u.iL || {};
            if (I.buildup) { if (u.bu) { dmg *= 1 + lerp(I.buildup, 0.25, 0.8); u.bu = false; } else u.bu = true; }
            if (I.overdrive && u.od) { dmg *= 1 + lerp(I.overdrive, 1, 3); u.od = false; }
            if (u.rvT > 0) dmg *= 1 + u.rvA;
            if (target.soul > 0) dmg *= 2; // 영혼 분리: 영혼에 가한 피해가 본체에도 전달
            if (u.big > 0) dmg *= 1.25;
            if (u.ghost) dmg *= lerp(I.undying || 1, 0.4, 0.8);
            
            
            if (I.relentless) u.rel = Math.min(Math.round(lerp(I.relentless, 4, 6)), (u.rel || 0) + 1); // 연속 공격마다 중첩
            target.hp -= dmg;
            if (u.steal) u.hp = Math.min(u.maxHp, u.hp + dmg * u.steal);
            if (u.burn) { target.burn = 3; target.burnDps = Math.max(target.burnDps || 0, u.atk * u.burn); }
            pop(dmg, 'R', crit ? '#fbbf24' : '#e8eaf0');
            u.hits = (u.hits || 0) + 1;
            const alive = () => G.enemies.filter(x => x !== target && x.hp > 0);
            const hitE = (e, m, col) => hitFx(e, u.atk * m, col, now);
            if (I.volley && u.hits % 3 === 0) hitE(target, lerp(I.volley, 0.4, 1.3));
            if (I.pierce) behindE(target, Math.round(lerp(I.pierce, 1, 3))).forEach(e => hitE(e, lerp(I.pierce, 0.25, 0.35)));
            if (I.transfer) nearestOthers(target, Math.round(lerp(I.transfer, 1, 3))).forEach(e => { e.hp -= dmg * 0.3; e.hitAt = now; });
            if (I.bash && Math.random() < 0.18) target.stun = Math.max(target.stun || 0, lerp(I.bash, 0.5, 1.3));
            if (I.blind && Math.random() < 0.16) target.blind = lerp(I.blind, 0.4, 1.3);
            if (I.knockback && Math.random() < 0.18) { target.cd += lerp(I.knockback, 0.8, 2); target.kb = lerp(I.knockback, 14, 90); target.kbT = lerp(I.knockback, 0.6, 1.6); } // 밀쳐냄 (LV5는 멀리)
            if (I.poison && Math.random() < 0.25) { target.psn = Math.round(lerp(I.poison, 2, 5)); target.psnPct = lerp(I.poison, 0.012, 0.02); }
            if (I.shrink && Math.random() < lerp(I.shrink, 0.1, 0.2)) { target.shr = 3; target.shrP = lerp(I.shrink, 0.2, 0.4); target.shrI = u.spd * u.spdM * 1.1; } // 공격 속도가 이 유닛보다 느려짐
            if (I.soulsplit) target.soul = lerp(I.soulsplit, 3, 5);
            if (I.meteor && Math.random() < 0.1) { const R = 1.1 + Math.min(2, Math.log2(1 + target.maxHp / 60) * 0.35); [target, ...nearEnemies(target, R, 2)].forEach(e => hitE(e, lerp(I.meteor, 1.8, 3), '#fb923c')); } // 최대 체력이 높을수록 범위 증가
            if (I.skyward && Math.random() < 0.12) { const dur = lerp(I.skyward, 0.8, 1.2); target.stun = Math.max(target.stun || 0, dur); target.kb = -20; target.kbT = dur; target.sky = { u, m: lerp(I.skyward, 1.1, 2), t: dur }; } // 공중에 띄우고 착지 시 주변 피해
            if (I.quake && Math.random() < 0.12) G.enemies.filter(x => x.hp > 0).forEach(e => { hitE(e, lerp(I.quake, 1, 1.8), '#f59e0b'); e.stun = Math.max(e.stun || 0, 1); });
            if (I.overdrive && target.hp <= 0) u.od = true;
            if (I.lifesteal) u.hp = Math.min(u.maxHp, u.hp + dmg * lerp(I.lifesteal, 0.04, 0.12));
            if (I.chain) { let cur = target; const vis = [target]; for (let k = 0; k < Math.round(lerp(I.chain, 1, 5)); k++) { const nx = nearestOthers(cur, 1, vis)[0]; if (!nx) break; vis.push(nx); hitFx(nx, dmg, '#7dd3fc', now); cur = nx; } } // 가장 가까운 적으로 연쇄
            if (I.fear && Math.random() < lerp(I.fear, 0.15, 0.25)) { const d = lerp(I.fear, 0.8, 1.2); target.stun = Math.max(target.stun || 0, d); target.kb = 50; target.kbT = d; } // 공포: 도망
            if (I.chill) { target.chill = 4; target.chP = lerp(I.chill, 0.25, 0.45); }
            
            if (I.execute && target.hp > 0 && target.hp / target.maxHp <= lerp(I.execute, 0.1, 0.18)) { target.hp = 0; pop(target.maxHp, 'R', '#f87171'); }
            if (I.timeless && Math.random() < lerp(I.timeless, 0.08, 0.18)) liveE().forEach(e => { e.stun = Math.max(e.stun || 0, lerp(I.timeless, 3, 6)); });
            if (I.overlord && target.hp <= 0 && !target.converted && G.minions.filter(m => m.kind === 'follower' && m.owner === u).length < Math.round(lerp(I.overlord, 2, 4))) { target.converted = true; spawnMinion(Object.assign({ kind: 'follower', owner: u, icon: target.icon, name: '추종자', maxHp: target.maxHp, atk: target.atk, spd: target.spd, persist: !!target.boss }, nearOwner(u))); } // 처치한 적을 추종자로
            if (u.cleave && Math.random() < u.cleave) { const o = G.enemies.filter(x => x !== target && x.hp > 0); if (o.length) { const t2 = o[Math.floor(Math.random() * o.length)]; t2.hp -= dmg * 0.5 * (1 - (t2.dr || 0)); t2.hitAt = now; } }
          }
        }
        if (u.sub && G.enemies.length) { u.sk -= dt; if (u.sk <= 0) { u.sk = 4; useSkill(u, now); } }
      });
      G.enemies = G.enemies.filter(e => e.hp > 0);

      const pool = G.units.concat(G.minions);
      G.enemies.forEach(e => {

          : row('🔒 ???', `Wave ${x.need} 도달 시 해금`)).join('') +
        row('각인', Object.keys(IMPR).map(id => META.dex.t.includes(id) ? IMPR[id].n : '???').join(' · ')) +
        row('전직 루트', `${META.dex.s.filter(x => x.includes(':')).length}/${CLASS_TOTAL}`) +
        row('기록', `최고 Wave ${META.best}`);
    }

    function pop(v, side, color) {
      const el = document.createElement('div');
      el.className = 'pop';
      const val = Math.round(v);
      el.textContent = val === 0 ? 'MISS' : val;
      el.style.color = color;
      el.style.fontSize = (val > 30 || val === 0) ? '16px' : '14px';
      el.style.fontWeight = '900';
      el.style.left = (side === 'R' ? 60 + Math.random() * 26 : 10 + Math.random() * 26) + '%';
      el.style.top = (22 + Math.random() * 32) + '%';
      $('fx').appendChild(el);
      setTimeout(() => el.remove(), 750);
    }

      ['keg','B','화약통',55,'이 코어가 선택지에 등장할 수 있습니다.',['arsonist'],[2,1],null,1],
      ['burstberry','B','폭발 베리',150,'이 코어가 선택지에 등장할 수 있습니다.',['keg'],[3,1],null,1],
      ['crest','O','동맹의 문장',15,'진영 시너지 시스템을 해금합니다.',['sigil'],null,null,1],
      ['collection','O','도감',3,'도감을 해금합니다.',['sigil'],null,null,0],
      ['arcane','O','비전 진영',40,'비전 진영을 해금합니다.',['crest'],[1,1],null,1],
      ['abyss','O','심연 진영',70,'심연 진영을 해금합니다.',['arcane'],[2,1],null,1],
      ['undead','O','언데드 진영',70,'언데드 진영을 해금합니다.',['abyss'],[2,1],null,1],
      ['celestial','O','천상 진영',120,'천상 진영을 해금합니다.',['undead'],[3,0],null,1],
    ];
    const GROUPS = {
      supply: ['life1','life2','noviceShield','comeback','gateRec','initSupply','supplyWh','expedition','contractExt','retry1','retry2','interest','victory','spareSpin'],
      units: ['cmd1','cmd2','cmd3','dormant','calcLuck','bloodbath','predatory','rapid','versatile','anchored','heavy'],
      research: ['advUnlock','advR1','advR2','rareUnlock','rareR1','rareR2','legUnlock','legR1','legR2','prismUnlock','prismR1','prismR2','fateUnlock','twin','breeze','omen','special','mastery','rift','constellation','sanctum','gambit','questReroll'],
      shop: ['reroll','recycling','regulars','dustCloak','cursedMushroom','shieldManual','ricochet','tunnel','hourglass','healingSpring','magicCircle','guardianTotem','peddler','chalice','burningHeart'],
      core: ['goldTooth','witchTorch','chaliceGreed','jokerGrin','blackNote','anvil','crookedFang','magicLamp','clover','tricksterCube','hammer','wildcard','goldenLever','echoShell','greedyPearl','reverseAxis','cycleBell','reboundAxis','jesterCandle','goldenCrest'],
      blast: ['blastUnlock','blastMastery','blastCart','updraft','spore','arsonist','keg','burstberry'],
    };
    const GROUP_NAME = { supply: '보급', units: '유닛', research: '연구·운명의 돌', shop: '상점', core: '코어 해금', blast: '블라스트' };
    const NODES = {}; NODE_ROWS.forEach(r => { NODES[r[0]] = { id: r[0], cat: r[1], name: r[2], cost: r[3], d: r[4], req: r[5], clear: r[6], grp: r[7], inert: !!r[8] }; });
    ['earlyPick', 'radiantFirst', 'lingering', 'goldTooth', 'blackNote'].forEach(id => { NODES[id].inert = false; }); // 코어 시스템과 연결됨
    const NODE_CATS = [['R', '연구'], ['S', '보급'], ['U', '유닛'], ['H', '상점'], ['C', '코어'], ['B', '블라스트'], ['O', '기타']];
    const has = id => !!META.tree[id];
    const hasN = id => has(id) ? 1 : 0;
    const clearedAt = (s, d) => [0, 1, 2].filter(x => x >= d).some(x => CLR(s, x)); // 해당 난이도 이상 클리어
    function nodeLock(n) { // 구매 불가 사유 (없으면 null)
      for (const r of n.req) if (!has(r)) return `선행: ${NODES[r].name}`;
      if (n.clear && !clearedAt(n.clear[0], n.clear[1])) return `${STAGES[n.clear[0]].n} ${DIFFS[n.clear[1]].n} 클리어 필요`;
      if (n.grp) { const mem = GROUPS[n.grp[0]].filter(x => x !== n.id), goal = n.grp[1] >= mem.length ? mem.length : n.grp[1], got = mem.filter(has).length; if (got < goal) return `${GROUP_NAME[n.grp[0]]} 업그레이드 ${got}/${goal} 필요`; }
      return null;
    }
    const baseMax = () => 100 + 20 * (hasN('life1') + hasN('life2'));
    const rerollCost = () => Math.max(1, rerollCost() - hasN('reroll'));
    const itemCost = b => Math.max(1, b - (has('regulars') && !G.regUsed ? 1 : 0));
    // 아이템: 구매 즉시 사용. use()가 false면 사용 불가(루비 차감 없음)
    const ITEMS = [
      { id: 'spin',   icon: '🎰', name: '스핀 팩',    desc: '스핀 +5회',          cost: 6, use: () => { G.spins += 5; return true; } },
      { id: 'gold',   icon: '💰', name: '골드 주머니', desc: '골드 +500',          cost: 8, use: () => { G.gold += 500; return true; } },
      { id: 'repair', icon: '🏰', name: '기지 수리',   desc: '기지 HP +50 (최대 100)', cost: 6, fail: '기지 HP가 이미 가득해요',
        use: () => { if (G.baseHp >= baseMax()) return false; G.baseHp = Math.min(baseMax(), G.baseHp + 50); return true; } },
      { id: 'summon', icon: '🎫', name: '소환권',      desc: '랜덤 유닛 1기 즉시 소환', cost: 10, fail: '보드가 가득 찼어요',
        use: () => { if (G.units.length >= maxUnits() && G.bench.length >= BENCH_MAX) return false; summonUnit(weightedRandom(true)); return true; } },
      { id: 'advs',   icon: '✨', name: '승급 소환권', desc: 'Advanced 유닛 1기 즉시 소환', cost: 18, fail: '보드가 가득 찼어요',
        use: () => { if (G.units.length >= maxUnits() && G.bench.length >= BENCH_MAX) return false; summonUnit(weightedRandom(true), { minTier: 'a' }); return true; } },
    ];
    // 패시브 아이템: 정수로 구매/레벨업(최대 Lv3), 장착 칸(기본 6, 최대 8)을 차지. 일부는 루비(기원석)로 영구 해금
    const iLv = id => (G.items && G.items[id]) || 0;
    const itemCap = () => 6 + hasN('slot1') + hasN('slot2');
    const PASSIVES = [
      { id: 'p_atk',  icon: '⚔️', name: '공격의 인장',  d: l => `전 유닛 공격력 +${8 * l}%`, unl: 1 },
      { id: 'p_hp',   icon: '🛡️', name: '강철 부적',    d: l => `전 유닛 체력 +${8 * l}%`, unl: 1 },
      { id: 'p_gold', icon: '🪙', name: '행운의 동전',  d: l => `웨이브 클리어 골드 +${12 * l}%`, unl: 1 },
      { id: 'p_spin', icon: '🎰', name: '슬롯 조율기',  d: l => `웨이브 클리어 스핀 +${l}회`, unl: 1 },
      { id: 'p_spd',  icon: '👢', name: '신속의 장화',  d: l => `공격 간격 -${4 * l}%`, ruby: 25 },
      { id: 'p_ess',  icon: '🔷', name: '정수 결정',    d: l => `웨이브 클리어 정수 +${l}`, ruby: 30 },
      { id: 'p_abs',  icon: '🧪', name: '흡수 촉매',    d: l => `흡수할 때 흡수 LV +${l}`, ruby: 40 },
      { id: 'p_int',  icon: '📈', name: '복리 장부',    d: l => `골드 이자율 +${3 * l}%p (기본 5%)`, ruby: 40 },
    ].map(x => Object.assign(x, { passive: true }));
    const passiveOpen = p => true;
    const passiveCost = p => 7 + 4 * iLv(p.id);
    const equippedCount = () => Object.keys(G.items || {}).filter(k => G.items[k] > 0).length;
    const itemById = id => ITEMS.find(x => x.id === id) || PASSIVES.find(x => x.id === id);
    function reapplyAll() { [...G.units, ...G.bench].forEach(x => { const r = x.hp / x.maxHp; applyStats(x); x.hp = x.maxHp * r; }); }
    // 정수 상점: 웨이브마다 4종 진열(패시브 2종 이상 보장), 리롤 가능 (한 판 안에서만 쓰는 재화)
    function rollStock() {
      const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      const ps = shuf(PASSIVES.filter(p => passiveOpen(p) && iLv(p.id) < 3).map(p => p.id));
      const first = ps.slice(0, 2), rest = shuf([...ITEMS.map(i => i.id), ...ps.slice(2)]);
      G.stock = [...first, ...rest].slice(0, 4);
    }
    function newStock() { rollStock(); G.rerolls = 0; }

    function loadMeta() {
      try {
        const d = JSON.parse(localStorage.getItem(SAVE_KEY) || localStorage.getItem(LEGACY_SAVE_KEY) || 'null');
        if (d) {
          META.ruby = d.ruby | 0; META.best = d.best | 0; META.clear = d.clear || {}; META.unl = d.unl || {}; META.tree = d.tree || {};
          if (d.dex) META.dex = { u: d.dex.u || [], t: d.dex.t || [], s: d.dex.s || [], a: d.dex.a || [], l: d.dex.l || [] };
          Object.assign(META.up, d.up || {});
          saveMeta();
        }
      } catch (e) {}
    }
    function saveMeta() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e) {} }

    let treeCat = 'R';
    const nodeDepth = n => n.req.length ? 1 + Math.max(...n.req.map(r => nodeDepth(NODES[r]))) : 0;
    const affordableNodes = () => NODE_ROWS.filter(r => !has(r[0]) && !nodeLock(NODES[r[0]]) && META.ruby >= r[3]).length;
    function treeHtml() {
      const bought = NODE_ROWS.filter(r => has(r[0])).length;
      const chips = NODE_CATS.map(([c, nm]) => { const rows = NODE_ROWS.filter(r => r[1] === c); return `<button class="dtab${c === treeCat ? ' on' : ''}" data-cat="${c}">${nm} ${rows.filter(r => has(r[0])).length}/${rows.length}</button>`; }).join('');
      const list = NODE_ROWS.map(r => NODES[r[0]]).filter(n => n.cat === treeCat).sort((a, b) => nodeDepth(a) - nodeDepth(b) || a.cost - b.cost).map(n => {
        const done = has(n.id), lock = done ? null : nodeLock(n);
        const reqTxt = n.req.length ? '선행: ' + n.req.map(r => (has(r) ? '✔' : '') + NODES[r].name).join(', ') : '시작 노드';
        const cond = (n.clear ? ` · ${STAGES[n.clear[0]].n} ${DIFFS[n.clear[1]].n} 클리어` : '') + (n.grp ? ` · ${GROUP_NAME[n.grp[0]]} ${n.grp[1] >= GROUPS[n.grp[0]].filter(x => x !== n.id).length ? '전부' : n.grp[1] + '개'} 구매` : '');
        return `<div class="shop-row"><div class="info">${done ? '✅' : lock ? '🔒' : '🔓'} ${n.name}${n.inert ? ' 🚧' : ''}<small>${n.d}<br>${reqTxt}${cond}${lock ? '<br><b style="color:#fca5a5">' + lock + '</b>' : ''}</small></div><button class="buy" data-node="${n.id}" ${done || lock || META.ruby < n.cost ? 'disabled' : ''}>${done ? '완료' : '💎 ' + n.cost}</button></div>`;
      }).join('');
      return `<div class="shop-row"><div class="info">🔮 기원석 업그레이드 트리<small>해금 ${bought}/${NODE_ROWS.length} · 보유 💎 ${META.ruby} · 🚧 = 아직 효과가 연결되지 않은 노드 (해당 시스템 준비 중)</small></div></div><div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">${chips}</div>` + list;
    }
    let shopTab = 'items';
    function renderShop() {
      $('rubyShop').textContent = META.ruby; $('essShop').textContent = G.essence | 0;
      $('shopList').innerHTML = shopTab === 'dex' ? (has('collection') ? dexHtml() : '<div class="shop-row"><div class="info">🔒 도감<small>업그레이드 트리 "기타"의 도감 노드(💎3)를 구매하면 열립니다</small></div></div>') : shopTab === 'items'
        ? `<div class="shop-row"><div class="info">🎒 장착 ${equippedCount()}/${itemCap()}<small>${PASSIVES.filter(p => iLv(p.id) > 0).map(p => p.icon + p.name + ' Lv' + iLv(p.id)).join(' · ') || '없음'}</small></div></div>`
          + ((G.stock || []).map(itemById).filter(Boolean).map(it => {
            if (it.passive) {
              const cur = iLv(it.id), cost = itemCost(passiveCost(it)), noSlot = cur === 0 && equippedCount() >= itemCap();
              return `<div class="shop-row"><div class="info">${it.icon} ${it.name} ${cur ? 'Lv' + cur + ' → Lv' + (cur + 1) : '(NEW)'}<small>${it.d(cur + 1)}${noSlot ? ' · 장착 칸 부족' : ''}</small></div><button class="buy" data-item="${it.id}" ${G.essence < cost || noSlot ? 'disabled' : ''}>🔷 ${cost}</button></div>`;
            }
            return `<div class="shop-row"><div class="info">${it.icon} ${it.name}<small>${it.desc}</small></div><button class="buy" data-item="${it.id}" ${G.essence < itemCost(it.cost) ? 'disabled' : ''}>🔷 ${itemCost(it.cost)}</button></div>`;
          }).join('') || '<div class="shop-row"><div class="info">품절<small>리롤하거나 다음 웨이브 클리어 후 새 상품이 들어와요</small></div></div>')
          + `<div class="shop-row"><div class="info">🔄 리롤<small>진열 상품을 새로 고칩니다 (정수는 이번 판에만 쓰여요)</small></div><button class="buy" data-reroll="1" ${G.essence < rerollCost() ? 'disabled' : ''}>🔷 ${rerollCost()}</button></div>`
        : treeHtml();
    }

    $('shopList').addEventListener('click', e => {
      const ch = e.target.closest('[data-cat]');
      if (ch) { treeCat = ch.dataset.cat; renderShop(); return; }
      const b = e.target.closest('.buy');
      if (!b || b.disabled) return;
      const msg = $('shopMsg');
      if (b.dataset.reroll) {
        if (G.phase === 'over') { msg.textContent = '게임 오버 상태예요. 다시 시작한 뒤 사용하세요'; return; }
        const rc = rerollCost(); if (G.essence < rc) { msg.textContent = '정수가 부족해요'; return; }
        G.essence -= rc; G.rerolls += 1; rollStock(); msg.textContent = '상품을 새로 고쳤어요';
      } else if (b.dataset.item) {
        const it = itemById(b.dataset.item);
        if (G.phase === 'over') { msg.textContent = '게임 오버 상태예요. 다시 시작한 뒤 사용하세요'; return; }
        if (it.passive) {
          const cur = iLv(it.id), cost = itemCost(passiveCost(it));
          if (G.essence < cost) { msg.textContent = '정수가 부족해요'; return; }
          if (cur === 0 && equippedCount() >= itemCap()) { msg.textContent = '장착 칸이 부족해요'; return; }
          G.essence -= cost; G.items[it.id] = cur + 1; G.stock = G.stock.filter(id => id !== it.id); if (has('regulars')) G.regUsed = true;
          reapplyAll(); msg.textContent = `${it.icon} ${it.name} Lv${cur + 1}!`;
          saveMeta(); updateHud(); renderShop(); renderField(); renderBoard(); return;
        }
        const ic = itemCost(it.cost);
        if (G.essence < ic) { msg.textContent = '정수가 부족해요'; return; }
        if (!it.use()) { msg.textContent = it.fail; return; }
        G.essence -= ic; if (has('regulars')) G.regUsed = true; G.stock = G.stock.filter(id => id !== it.id);
        msg.textContent = `${it.name} 사용!`;
      } else if (b.dataset.node) {
        const n = NODES[b.dataset.node];
        if (!n || has(n.id) || nodeLock(n) || META.ruby < n.cost) return;
        META.ruby -= n.cost; META.tree[n.id] = 1; msg.textContent = `${n.name} 해금!`;
        reapplyAll();
      }
      saveMeta(); updateHud(); renderShop(); renderField();
    });

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      shopTab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
      $('shopMsg').textContent = '';
      renderShop();
    }));
    function closeShop() {
      $('shopPanel').classList.remove('open');
      overlay.classList.remove('show');
      mainArea.classList.remove('dimmed');
    }
    $('shopBtn').addEventListener('click', () => {
      $('shopMsg').textContent = '';
      renderShop();
      $('shopPanel').classList.add('open');
      overlay.classList.add('show');
      mainArea.classList.add('dimmed');
    });
    $('shopClose').addEventListener('click', closeShop);
    overlay.addEventListener('click', closeShop);
    loadMeta();
    renderLobby();

    startBtn.addEventListener('click', () => G.phase === 'over' ? resetGame() : startWave());
    resetGame();
  </script>
</body>
</html>
