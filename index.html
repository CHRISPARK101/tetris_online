<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tetris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff7;--ink:#1a1f36;--mute:#6a7190;--well:#f9faff;--grid:#e3e6f2;
  --btn:#ffffff;--line:#d3d8ea;--accent:#4a5cf0;--onaccent:#ffffff;--veil:rgba(236,239,247,.9);--veil2:rgba(236,239,247,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1224;--ink:#e8ebff;--mute:#8c93b8;--well:#171b36;--grid:#232848;--btn:#1d2242;--line:#2c3260;--accent:#7585ff;--onaccent:#0f1224;--veil:rgba(15,18,36,.88);--veil2:rgba(15,18,36,.5)}
}
:root[data-theme="dark"]{--bg:#0f1224;--ink:#e8ebff;--mute:#8c93b8;--well:#171b36;--grid:#232848;--btn:#1d2242;--line:#2c3260;--accent:#7585ff;--onaccent:#0f1224;--veil:rgba(15,18,36,.88);--veil2:rgba(15,18,36,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;overflow:hidden}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:10px 12px 18px;box-sizing:border-box}
.hud{display:grid;grid-template-columns:1.5fr 1fr 1fr auto auto;gap:8px;align-items:center}
.stat small{display:block;font-size:calc(var(--cs,20px)*.5);color:var(--mute)}
.stat b{display:block;font-size:calc(var(--cs,20px)*.85);font-variant-numeric:tabular-nums;line-height:1.2}
#next{display:block;border-radius:8px;border:1px solid var(--line);background:var(--well)}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:14px;touch-action:manipulation;cursor:pointer}
#pause{flex:none;width:calc(var(--cs,20px)*2.2);height:calc(var(--cs,20px)*2.2);font-size:calc(var(--cs,20px)*.8);padding:0}
#stage{position:relative;flex:1;min-height:0}
.well{position:absolute;line-height:0}
#side{position:absolute;display:flex;flex-direction:column;gap:6px;min-height:0}
#side .top{display:flex;gap:6px;align-items:center}
#side .meta{display:flex;flex-wrap:wrap;gap:0 6px;justify-content:space-between;font-size:calc(var(--cs,20px)*.5);color:var(--mute)}
#ol{font-size:calc(var(--cs,20px)*.55);font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mf{font-size:1.15em;vertical-align:middle}
#mywho{white-space:nowrap}
#ol[hidden]{display:none}
.fl{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-weight:400}
.ccr{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
#cc{max-width:150px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:14px}
#lvbox{display:flex;flex-direction:column;align-items:center;gap:16px}
#lvbox .lvr{display:flex;gap:6px}
#lvbox[hidden]{display:none}
#board{display:block;border-radius:10px;border:1px solid var(--line);background:var(--well);touch-action:none}
#ov{position:absolute;inset:0;border-radius:10px;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;line-height:1.4}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:34px;letter-spacing:-.02em}
#ov p{margin:0;font-size:14px;color:var(--mute);max-width:240px}
#go{margin-top:6px;padding:14px 34px;font-size:18px;font-weight:700;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
#settings{position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;padding:0;border-radius:50%;font-size:23px;display:flex;align-items:center;justify-content:center;line-height:1}
#settings:focus-visible{outline-offset:2px}
#cb{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--onaccent);font-size:13px;font-weight:700;line-height:1.4;pointer-events:none;white-space:nowrap}
#cb[hidden]{display:none}
#cpop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30;line-height:1}
#cpop .cp{display:flex;flex-direction:column;align-items:center;font-family:"Jua","Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Apple SD Gothic Neo","PingFang SC","PingFang TC","Noto Sans CJK SC","Noto Sans CJK TC","Noto Sans CJK JP",system-ui,sans-serif;font-weight:900;letter-spacing:.02em;will-change:transform,opacity;--fill:#ffd93d;--ext:#e07a00}
#cpop .cp.t1{--fill:#ffa54a;--ext:#d44a00}
#cpop .cp.t2{--fill:#ff74b8;--ext:#c2185b}
#cpop .cp.t3{--fill:#8c6bff;--ext:#3b1fb8}
#cpop .cp span{display:block;color:var(--fill);text-shadow:.06em 0 #fff,-.06em 0 #fff,0 .06em #fff,0 -.06em #fff,.045em .045em #fff,-.045em .045em #fff,.045em -.045em #fff,-.045em -.045em #fff,0 .13em 0 var(--ext),0 .17em .12em rgba(0,0,0,.25)}
#cpop .ct{font-size:calc(var(--cs,24px)*1.35)}
#cpop .cn{font-size:calc(var(--cs,24px)*3.6);margin-top:-.08em}
#cpop .cn i{font-style:normal;font-size:.6em;margin-left:.04em}
#cpop .csp{position:absolute;left:50%;top:50%;width:calc(var(--cs,24px)*.9);height:calc(var(--cs,24px)*.9);margin:calc(var(--cs,24px)*-.45) 0 0 calc(var(--cs,24px)*-.45);will-change:transform,opacity}
#cpop .csp svg{width:100%;height:100%;display:block}
#vs,#cpub,#rs,#qt,#netbox button,#lvbox button{padding:8px 14px;font-size:14px}
#lvbox .lvr button{padding:8px 10px}
#lback{background:transparent}
.sw{position:relative;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:6px 0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
#netbox{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center}
#netbox[hidden]{display:none}
#code{width:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:18px;text-align:center}
#opp{display:block;border-radius:8px;border:1px solid var(--line);background:var(--well)}
#opp[hidden]{display:none}
.ctl{--bh:clamp(48px,7vh,60px);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.cl{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,var(--bh));gap:10px 14px}
.cl [data-act="down"]{grid-column:1/3;grid-row:2}
.cr{display:grid;grid-template-rows:repeat(2,var(--bh));gap:10px}
.ctl button{height:auto;font-size:22px;font-weight:600}
.ctl button:active,.ctl button.on{transform:scale(.96);background:var(--line)}
.ctl [data-act="rot"],.ctl [data-act="drop"]{font-size:15px;white-space:nowrap}
.ctl [data-act="rot"]{font-size:17px;background:var(--btn);border-width:2px;border-color:var(--accent)}
.ctl [data-act="drop"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
#fire{--fire:#ff9a3c;--fs:64px;flex:none;align-self:center;margin-top:auto;margin-bottom:8px;width:var(--fs);height:var(--fs);padding:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#2a1400;line-height:1;border:1px solid #c85f0a;
  background:radial-gradient(circle at 35% 26%,#ffe2b8 0,#ffbb6b 24%,#ff8f26 60%,#e56e0c 100%);
  box-shadow:0 6px 0 #b04a04,0 10px 12px rgba(0,0,0,.28),inset 0 3px 5px rgba(255,255,255,.7),inset 0 -6px 9px rgba(150,55,0,.35);
  transition:transform .06s,box-shadow .06s}
#fire.on,#fire:active{background:radial-gradient(circle at 35% 26%,#ffe2b8 0,#ffbb6b 24%,#ff8f26 60%,#e56e0c 100%);transform:translateY(5px);box-shadow:0 1px 0 #b04a04,0 3px 6px rgba(0,0,0,.25),inset 0 3px 5px rgba(255,255,255,.55),inset 0 -4px 7px rgba(150,55,0,.4)}
#fire.nof{visibility:hidden}
#fire .fi .ico{width:calc(var(--fs)*.44);height:calc(var(--fs)*.44)}
#inv .sl .ico{width:24px;height:24px}
#bf .ico{width:20px;height:20px;display:inline-block;vertical-align:middle;margin-right:2px}
#bf b{font-size:14px;vertical-align:middle;margin-right:4px}
.fly .ico{width:1em;height:1em;display:block}
.ico{flex:none}
#fire .fi{font-size:24px;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-weight:400}
#fire small{font-size:11px;font-weight:800;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#fire.empty{opacity:.4;filter:grayscale(.6)}
.ctl.noitem #fire{visibility:hidden}
#inv{position:absolute;height:38px;display:flex;justify-content:center;align-items:center;gap:6px}
#inv[hidden]{display:none}
#inv .sl{width:34px;height:34px;border-radius:10px;border:1px dashed var(--line);background:var(--well);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;box-sizing:border-box}
#inv .sl.f{border:2px solid var(--fire,#ff9a3c);background:var(--btn);width:38px;height:38px;cursor:pointer}
#inv .sl.pop{animation:invpop .35s}
@keyframes invpop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.sw.locked{cursor:default}
.sw input:disabled+i{opacity:.55}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{-webkit-user-select:text;user-select:text}
#ov{overflow:auto}
#settingsbox[hidden]{display:none}
.setting-title{font-size:18px;margin:8px 0 4px}
#settingsbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.language-row{width:min(280px,90%);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.language-row select{max-width:58%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit}
.music-volume{width:min(280px,90%);display:flex;flex-direction:column;gap:8px;text-align:left;margin:4px 0 8px}
.music-volume label{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.music-volume input[type=range]{width:100%;cursor:pointer;accent-color:var(--accent)}
#rk,#nbox button{padding:8px 14px;font-size:14px}
#nbox{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#nbox[hidden]{display:none}
#nick{width:150px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:16px;text-align:center}
#rank{position:fixed;inset:0;z-index:30;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:16px}
#rank[hidden]{display:none}
#ver{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);text-align:center;font-size:10px;line-height:1;color:var(--mute);opacity:.65;pointer-events:none}
.rk-card{width:min(100%,420px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden;background:var(--well);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.rk-card h2{flex:0 0 auto;margin:0 0 10px;font-size:22px}
#rank button{padding:10px 24px}
#rank .rk-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
#rstart{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
#rlist{flex:0 1 260px;max-height:min(260px,38vh);min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;list-style:none;margin:0;padding:0;text-align:left}
#rlist li{display:grid;grid-template-columns:28px 1fr auto;column-gap:10px;padding:8px 10px;border-radius:10px;line-height:1.3}
#rlist li:nth-child(odd){background:var(--btn)}
#rlist li.me{outline:2px solid var(--accent)}
#rlist .rn{grid-row:1/3;align-self:center;font-weight:700;color:var(--mute)}
#rlist li:first-child .rn{color:var(--accent)}
#rlist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rlist b{font-variant-numeric:tabular-nums;text-align:right}
#rlist small{grid-column:2/4;color:var(--mute)}
#rnote{flex:0 0 auto;margin:10px 0;font-size:13px;color:var(--mute)}
#rank .rk-actions{flex:0 0 auto}
#rlist{position:relative}
.rk-tabs{flex:0 0 auto;display:flex;justify-content:center;gap:8px;margin:0 0 10px}
#rank .rk-tabs button{padding:6px 16px;font-size:13px;border-radius:999px}
#rank .rk-tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
#ov.att{background:var(--veil2)}
#ov.att h1{background:linear-gradient(90deg,#2fc4e6,#4b6ff0,#a65bd8,#ee5a5a,#f28b3a,#f5c73b,#4cc46a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-size:40px}
#tt{position:absolute;top:38px;left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;line-height:1.4;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#tt[hidden]{display:none}
#bf{position:absolute;left:8px;top:8px;font-size:18px;line-height:1.1;letter-spacing:2px;pointer-events:none;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
#bf[hidden]{display:none}
#bf .bfm{filter:grayscale(1) contrast(1.15);opacity:.8}
.fly{position:fixed;left:0;top:0;z-index:80;pointer-events:none;line-height:1;white-space:nowrap;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;will-change:transform,opacity;filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,2px)}30%{transform:translate(6px,-3px)}45%{transform:translate(-5px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
.well.shake{animation:shk .45s}
@keyframes ohit{0%{box-shadow:0 0 0 0 rgba(229,72,77,.95);filter:brightness(1.5)}100%{box-shadow:0 0 18px 9px rgba(229,72,77,0);filter:none}}
#opp.hit{animation:ohit .6s}
@keyframes bhit{0%{box-shadow:inset 0 0 46px 12px rgba(229,72,77,.7)}100%{box-shadow:inset 0 0 0 0 rgba(229,72,77,0)}}
#board.hit{animation:bhit .65s}
#ov #rcfg{display:flex;flex-direction:column;align-items:center;margin:4px 0}
#ov #rcfg[hidden]{display:none}
#ov #rcfgtitle{font-weight:700;color:var(--ink);font-size:14px}
#ov #rcfgnote{font-size:12px;max-width:260px}
#ov #itmhelp{font-size:12px;max-width:260px;text-align:left;margin:0 0 4px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="inv" hidden aria-label="Item queue"></div>
    <div class="well">
      <canvas id="board"></canvas>
      <div id="cb" hidden></div>
      <div id="cpop" aria-hidden="true"></div>
      <div id="tt" hidden></div>
      <div id="bf" hidden></div>
      <div id="ov">
        <h1 id="ot">TETRIS</h1>
        <p id="os">Drag to move, tap to rotate, flick down to drop</p>
        <p id="ob"></p>
        <div id="rcfg" hidden>
          <p id="rcfgtitle">Match settings</p>
          <label id="rgv" class="sw"><span>Gravity mode</span><input type="checkbox" id="rgvc" role="switch"><i></i></label>
          <label id="rit" class="sw"><span>Item mode</span><input type="checkbox" id="ritc" role="switch"><i></i></label>
          <p id="rcfgnote"></p>
        </div>
        <div id="nbox" hidden><input id="nick" maxlength="12" placeholder="Nickname" autocomplete="off" aria-label="Nickname"><button id="nsave">Save</button><button id="nskip">Skip</button></div>
        <button id="go">Start</button>
        <button id="rs">Restart</button>
        <button id="qt">Main menu</button>
        <button id="settings" aria-label="Settings" title="Settings">⚙️</button>
        <div id="settingsbox" hidden>
          <h2 class="setting-title" id="settingstitle">Settings</h2>
          <label class="language-row" for="languageSelect"><span id="languageLabel">Language</span><select id="languageSelect"><option value="auto">Automatic</option><option value="en">English</option><option value="ko">한국어</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="es">Español</option><option value="pt">Português</option><option value="fr">Français</option><option value="nl">Nederlands</option></select></label>
          <label id="gv" class="sw"><span>Gravity mode</span><input type="checkbox" id="gvc" role="switch"><i></i></label>
          <label id="itm" class="sw"><span>Item mode</span><input type="checkbox" id="itmc" role="switch"><i></i></label>
          <p id="itmhelp"></p>
          <label id="ghv" class="sw"><span>Landing preview</span><input type="checkbox" id="ghvc" role="switch"><i></i></label>
          <label id="snd" class="sw"><span>Sound effects</span><input type="checkbox" id="sndc" role="switch"><i></i></label>
          <div id="musicvol" class="music-volume">
            <label for="musicvolc"><span>Music volume</span><span id="musicvolvalue">33%</span></label>
            <input type="range" id="musicvolc" min="0" max="100" step="1" value="33" aria-label="Background music volume">
          </div>
          <button id="settingsback">Back</button>
        </div>
        <button id="vs">2P Battle</button>
        <button id="cpub">Vs CPU</button>
        <button id="rk">👑 Ranking</button>
        <div id="netbox" hidden><div class="ccr"><span id="ccf" class="fl"></span><select id="cc" aria-label="Your country"></select></div><input id="code" inputmode="numeric" maxlength="6" placeholder="4-digit code" aria-label="Room code"><button id="join">Join</button><button id="back">Back</button></div>
        <div id="lvbox" hidden><div class="lvr"><button data-l="0">Easy</button><button data-l="1">Normal</button><button data-l="2">Hard</button></div><button id="lback">Back</button></div>
      </div>
    </div>
    <div id="side">
      <div class="top"><button id="pause" aria-label="Pause">II</button><div class="stat"><small><span id="mywho">You</span> <span id="mf" class="fl" aria-label="Your country"></span></small><b id="sc">0</b></div></div>
      <div class="meta"><span><span id="lvl">Lv</span> <span id="lv">1</span></span><span><span id="lnl">Lines</span> <span id="ln">0</span></span><span id="tm">00:00</span></div>
      <canvas id="next" aria-label="Next piece"></canvas>
      <div id="ol" hidden>CPU</div>
      <canvas id="opp" hidden></canvas>
          <button id="fire" data-act="fire" class="empty" aria-label="Fire item"><span class="fi" id="firei"></span><small id="firel">Fire</small></button>
    </div>
  </div>
  <div class="ctl noitem">
    <div class="cl">
      <button data-act="left" aria-label="Left">◀</button>
      <button data-act="right" aria-label="Right">▶</button>
      <button data-act="down" aria-label="Down">▼</button>
    </div>
    <div class="cr">
      <button data-act="rot">Rotate</button>
      <button data-act="drop">Drop</button>
    </div>
  </div>
</div>
<div id="ver" aria-hidden="true">v0.7.0</div>
<div id="rank" hidden role="dialog" aria-label="Ranking"><div class="rk-card"><h2>Top 20</h2><div class="rk-tabs"><button id="rktn" class="on">Classic</button><button id="rkti">Item mode</button></div><ol id="rlist"></ol><p id="rnote"></p><div class="rk-actions"><button id="rstart">Start Game</button><button id="rclose">Close</button></div></div></div>
<audio id="bgmusic" loop preload="auto" src="music.mp3"></audio>
<script src="supabase.js"></script>
<script>
(function(){

        if(filtered)t=t.eq('items',items);
        return t.order('score',{ascending:false}).order('created_at',{ascending:true}).limit(RANK_N)
          .then(function(r){if(r.error)throw r.error;return{rows:r.data||[],remote:true}});
      };
      return q(true).catch(function(err){
        console.warn('Ranking load failed:',err);
        /* database without the "items" column yet: classic mode still shows the old single global board */
        if(!items)return q(false);
        throw err;
      }).catch(function(err){console.warn('Ranking load failed:',err);return{rows:localBoard(items),remote:false}});
    }catch(e){}
  }
  return Promise.resolve({rows:localBoard(items),remote:false});
}
function submitScore(e){
  e=normalizeScoreEntry(e);if(!e)return Promise.resolve(false);
  if(supabaseReady()){
    try{
      var ins=function(row){return getClient().from('scores').insert(row).then(function(r){if(r.error)throw r.error;return true})};
      var row={nick:e.nick,score:e.score,lines:e.lines,level:e.level,cc:e.cc||null,items:!!e.items};
      return ins(row).catch(function(err){
        console.warn('Ranking save failed:',err);
        if(!e.items){delete row.items;return ins(row)}      /* database without the "items" column: classic score still goes global */
        throw err;
      }).catch(function(err){console.warn('Ranking save failed:',err);return saveLocalEntry(e)});
    }catch(err){}
  }
  return Promise.resolve(saveLocalEntry(e));
}
function cleanNick(v){

function unlockCfg(){if(mode==='vs'&&cfgLocked){cfgLocked=false;push({lk:0})}}
/* back from "waiting for the opponent" to the choose-again screen */
function unready(){
  myRdy=false;push({rdy:false});
  if(state==='over'){setOS(endSub);$('go').style.display=''}
}
function noteFlash(){
  var n=$('rcfgnote');if(!n)return;
  n.textContent=tr('cfgchanged');n.style.color='var(--accent)';
  clearTimeout(cfgNoteTimer);
  cfgNoteTimer=setTimeout(function(){cfgNoteTimer=null;n.style.color='';renderCfg()},3500);
}
function renderCfg(){
  var rc=$('rcfg');if(!rc)return;
  var inRoom=mode==='vs'&&(state==='net'||state==='over'||state==='count');
  rc.hidden=!inRoom;
  if(!inRoom)return;
  var edit=(state==='net'||state==='over')&&!cfgLocked;      /* editable in the lobby and on the rematch screen, locked while a match runs */
  $('rgvc').checked=!!cfg.gv;$('ritc').checked=!!cfg.it;
  $('rgvc').disabled=$('ritc').disabled=!edit;
  $('rgv').classList.toggle('locked',!edit);$('rit').classList.toggle('locked',!edit);
  $('rcfgtitle').textContent=tr('roomcfg');
  if(!cfgNoteTimer)$('rcfgnote').textContent=tr(edit?'cfgnote':'cfglocked');
}
function cfgEdited(){
  if(cfgLocked||mode!=='vs'||(state!=='net'&&state!=='over')){renderCfg();return}
  cfg={gv:$('rgvc').checked?1:0,it:$('ritc').checked?1:0,sv:cfg.sv+1};
  push({gv:cfg.gv,it:cfg.it,sv:cfg.sv});
  if(myRdy){unready();noteFlash()}
  if(lastPeers)onPeers(lastPeers);else renderCfg();
}
$('rgvc').addEventListener('change',cfgEdited);
$('ritc').addEventListener('change',cfgEdited);
var leftTimer=null;
function onPeers(ch){lastPeers=ch;onPeersCore(ch);renderCfg()}
function onPeersCore(ch){
  var ps=ch.peers.filter(function(p){return p.kind==='viewer'});
  ps.sort(function(a,b){return ((a.presence.t||0)-(b.presence.t||0))||(a.peer<b.peer?-1:1)});
  var two=ps.slice(0,2);
  opp=null;meP=null;
  for(var i=0;i<two.length;i++){var p=two[i];if(p.sameTab)meP=p;else opp=p}
  olabel();
  /* shared match settings: adopt the other player's change (or their locked settings) before the first game */
  if(mode==='vs'&&opp&&!cfgLocked&&(state==='net'||state==='over')){
    var pp=opp.presence,psv=Number(pp.sv)||0,plk=pp.lk===1||pp.lk===true,ng=pp.gv?1:0,ni=pp.it?1:0;
    var diff=ng!==cfg.gv||ni!==cfg.it;
    var theirsWin=psv>cfg.sv||(psv===cfg.sv&&diff&&meP&&(Number(pp.t)||0)<(Number(meP.presence.t)||0));
    var lockedLobby=plk&&state==='net';          /* a locked peer only matters while both of us are still in the lobby */
    if(lockedLobby||theirsWin){
      cfg={gv:ng,it:ni,sv:Math.max(psv,cfg.sv)};
      if(lockedLobby)cfgLocked=true;
      if(diff&&myRdy)unready();
      if(diff)noteFlash();
    }
  }
  if(!meP&&state==='net'&&ps.some(function(q){return q.sameTab})){
    leaveRoom();state='ready';mode='solo';resize();
    overlay('battleTitle','roomfull','',false);
    ovui(false);$('netbox').hidden=false;
    return;
  }
  if(state==='playing'||state==='anim'||state==='clear'){
    if(!opp){
      if(!leftTimer)leftTimer=setTimeout(function(){leftTimer=null;if(!opp&&(state==='playing'||state==='anim'||state==='clear'))win('oppleft')},8000);
      return;
    }
    clearTimeout(leftTimer);leftTimer=null;
    var P=opp.presence;
    if(P.gs===gs){
      var a=Math.min(1000000,Math.max(0,Math.floor(Number(P.atk)||0)));
      if(a>seen){var take=Math.min(a-seen,6);pend=Math.min(pend+take,ROWS);seen+=take}
      var iqv=Math.min(1000000,Math.max(0,Math.floor(Number(P.iq)||0)));
      if(iqv>seenIq){
        var hasQueue=Array.isArray(P.ie),events=hasQueue?P.ie:[];
        if(hasQueue){events.forEach(function(ev){if(ev.id>seenIq&&ev.id<=iqv)receiveItem(ev.k)});}
        else if(ATTACKS.indexOf(P.ik)>=0){receiveItem(P.ik);} /* compatibility with older clients */
        /* Advance to the sequence watermark even if an old client sent no queue. */
        seenIq=iqv;
      }
      var swn=Math.floor(Number(P.swn)||0);
      if(swn>seenSw){seenSw=swn;receiveSwap(typeof P.sw==='string'?P.sw:'',swn)}
      if(swapWait&&Math.floor(Number(P.srn)||0)===swapWait.n)finishSwap(typeof P.sr==='string'?P.sr:'');
      if(P.dead===true)win('opptopped');
    }
    return;
  }
  if(!opp&&myRdy&&(state==='net'||state==='over'))setOS('waitreconn');
  if(state==='over'&&mode==='vs'&&!myRdy&&opp&&opp.presence.rdy===true)setOS('wantsrematch');
  if(state==='net'&&!myRdy){
    var occ=opp&&okc(opp.presence.cc)?opp.presence.cc:'',rc=roomCode;setOS(opp?(occ?function(){return fmt('oppjoinedfrom',{c:cname(occ)})}:'oppjoined'):fm('waitopp',{c:rc}));
    $('go').style.display=opp?'':'none';
  }
  check();
}
function ready(){
  if(!room||!opp){setOS('oppnotconn');$('qt').style.display='';return}
  myRdy=true;mySeed=Math.floor(Math.random()*1e9)+1;
  push({rdy:true,seed:mySeed,gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:cfgLocked?1:0,iq:0,ik:'',dead:false,atk:0});
  $('go').style.display='none';setOS('waitready');$('qt').style.display='';
  check();
}
function check(){
  if((state!=='net'&&state!=='over')||mode!=='vs'||!myRdy||!opp||!meP||!opp.presence.rdy||typeof opp.presence.seed!=='number')return;
  var th=opp.presence,useMine=mySeed<=th.seed;
  var c=pickCfg({gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:cfgLocked?1:0,seed:mySeed},
                {gv:th.gv?1:0,it:th.it?1:0,sv:Number(th.sv)||0,lk:(th.lk===1||th.lk===true)?1:0,seed:th.seed});
  beginCount(useMine?mySeed:th.seed,c);
}
/* Both clients run this with the same two inputs, so both end up with the same settings:
   the newer change wins, then (very unlikely) the smaller seed. */
function pickCfg(a,b){
  if(a.sv!==b.sv)return a.sv>b.sv?a:b;
  if(a.gv===b.gv&&a.it===b.it)return a;
  return a.seed<=b.seed?a:b;
}
var countTimer=null;
function beginCount(seed,c){
  if(countTimer)clearInterval(countTimer);
  cfg={gv:c.gv,it:c.it,sv:c.sv};cfgLocked=true;   /* locked from the first game on, rematches keep it */
  push({gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:1});

  countTimer=setInterval(function(){
    if(state!=='count'||mode!=='vs'||!room){clearInterval(countTimer);countTimer=null;return;}
    n--;

    clearInterval(countTimer);countTimer=null;
    gs=seed;gravity=!!cfg.gv;itemMode=!!cfg.it;myRdy=false;sentG='';
    push({gs:gs,atk:0,iq:0,ik:'',dead:false,rdy:false,g:'',sc:0});
    start();
  },1000);
}

    if(rm.onLost)rm.onLost(connLost);
    rm.onPeers(onPeers);
    return rm.presence({rdy:false,dead:false,gs:0,atk:0,g:'',sc:0,gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:0,t:Date.now(),cc:myCC}).then(function(){

function detectLang(){var pref='';try{pref=localStorage.getItem('tetris-language')||'auto'}catch(e){}LANG_PREF=pref;var raw=pref==='auto'?((navigator.languages&&navigator.languages[0])||navigator.language||'en'):pref;raw=String(raw).replace('_','-');if(raw.toLowerCase().indexOf('zh-tw')===0||raw.toLowerCase().indexOf('zh-hk')===0)return 'zh-TW';if(raw.toLowerCase().indexOf('zh')===0)return 'zh-CN';var key=raw.split('-')[0].toLowerCase();return I18N[key]?key:'en'}
function tr(key){return (I18N[LANG]&&I18N[LANG][key])||I18N.en[key]||key}
function applyLanguage(){
 LANG=detectLang();
 try{document.documentElement.lang=LANG}catch(e){}
 var sel=$('languageSelect');if(sel)sel.value=LANG_PREF;
 function txt(id,key){var el=$(id);if(el)el.textContent=tr(key)}
 function aria(el,key){if(el)el.setAttribute('aria-label',tr(key))}
 txt('settingstitle','settings');txt('languageLabel','language');
 [['rktn','rkclassic'],['rkti','items'],['gv','gravity'],['itm','items'],['rgv','gravity'],['rit','items'],['ghv','landing'],['snd','sound']].forEach(function(p){var el=$(p[0]),sp=el&&el.querySelector('span');if(sp)sp.textContent=tr(p[1])});
 txt('settingsback','back');txt('rs','restart');txt('qt','main');txt('vs','battle');txt('rk','ranking');txt('cpub','cpu');txt('join','join');txt('back','back');txt('lback','back');txt('nsave','save');txt('nskip','skip');txt('rstart','startgame');txt('rclose','close');
 txt('lvl','level');txt('lnl','lines');txt('itmhelp','itemhelp');
 var vol=$('musicvol');if(vol&&vol.querySelector('label span'))vol.querySelector('label span').textContent=tr('music');
 var opts=document.querySelectorAll('#lvbox button[data-l]');if(opts.length>=3){opts[0].textContent=tr('easy');opts[1].textContent=tr('normal');opts[2].textContent=tr('hard')}
 var ctl=document.querySelector('[data-act="rot"]');if(ctl)ctl.textContent=tr('rotate');ctl=document.querySelector('[data-act="drop"]');if(ctl)ctl.textContent=tr('drop');
 var fl=$('firel');if(fl)fl.textContent=tr('fire');aria($('fire'),'fire');aria($('inv'),'itemqueue');
 aria(document.querySelector('[data-act="left"]'),'left');aria(document.querySelector('[data-act="right"]'),'right');aria(document.querySelector('[data-act="down"]'),'down');
 var st=$('settings');if(st){st.setAttribute('aria-label',tr('settings'));st.title=tr('settings')}
 aria($('pause'),'pause');aria($('next'),'nextpiece');aria($('musicvolc'),'musicaria');aria($('cc'),'country');aria($('mf'),'country');
 $('languageSelect').querySelector('option[value="auto"]').textContent=tr('automatic');
 $('nick').placeholder=tr('nickname');aria($('nick'),'nickname');
 var codeTxt=fmt('roomcode',{n:ROOM_LEN});$('code').placeholder=codeTxt;$('code').setAttribute('aria-label',codeTxt);
 var rank=$('rank');if(rank){rank.setAttribute('aria-label',tr('ranking').replace('👑 ',''));var h=rank.querySelector('h2');if(h)h.textContent=tr('top')}
 initDN(LANG);fillCountries();
 olabel();
 renderOverlay();
}
$('languageSelect').addEventListener('change',function(){LANG_PREF=this.value;try{localStorage.setItem('tetris-language',LANG_PREF)}catch(e){}applyLanguage();});
applyLanguage();

grid=emptyGrid();
overlay('tetris','drag','start',true);
resize();hud();if(musicVolume>0)playMusic();
requestAnimationFrame(function(t){last=t;loop(t)});
})();
