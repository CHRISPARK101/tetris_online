<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1224">
<title>Brick Duel Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff7;--ink:#1a1f36;--mute:#6a7190;--well:#f9faff;--grid:#e3e6f2;
  --btn:#ffffff;--line:#d3d8ea;--accent:#4a5cf0;--onaccent:#ffffff;--veil:rgba(236,239,247,.9);--veil2:rgba(236,239,247,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1224;--ink:#e8ebff;--mute:#8c93b8;--well:#171b36;--grid:#232848;--btn:#1d2242;--line:#2c3260;--accent:#7585ff;--onaccent:#0f1224;--veil:rgba(15,18,36,.88);--veil2:rgba(15,18,36,.5)}
}
:root[data-theme="dark"]{--bg:#0f1224;--ink:#e8ebff;--mute:#8c93b8;--well:#171b36;--grid:#232848;--btn:#1d2242;--line:#2c3260;--accent:#7585ff;--onaccent:#0f1224;--veil:rgba(15,18,36,.88);--veil2:rgba(15,18,36,.5)}
:root{--kgloss:.55;--kedge:#aeb6d6;--kacc:#2f3eb5;--gl1:rgba(255,255,255,.85);--gl2:rgba(255,255,255,.3);--gl3:rgba(120,190,255,.16);--gl4:rgba(90,150,255,.3);--glb:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl1:rgba(255,255,255,.5);--gl2:rgba(255,255,255,.14);--gl3:rgba(120,170,255,.1);--gl4:rgba(100,150,255,.28);--glb:rgba(255,255,255,.42);--kgloss:.14;--kedge:#060818;--kacc:#4351c6}}
:root[data-theme="dark"]{--kgloss:.14;--kedge:#060818;--kacc:#4351c6;--gl1:rgba(255,255,255,.5);--gl2:rgba(255,255,255,.14);--gl3:rgba(120,170,255,.1);--gl4:rgba(100,150,255,.28);--glb:rgba(255,255,255,.42)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;overflow:hidden}
/* game-style font for the menu screens: Fredoka for Latin letters, Jua for Korean, rounded system fonts for other scripts */
#ov,#rank,#iguide{font-family:"Fredoka","Jua","Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Apple SD Gothic Neo","PingFang SC","PingFang TC","Noto Sans CJK JP","Noto Sans KR",system-ui,sans-serif;font-synthesis:none}
/* Item guide: small "?" next to the Item mode switches opens a short list of what each item does */
.swh{display:flex;align-items:center;justify-content:center;gap:8px}
.ihelp{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;box-sizing:border-box;width:24px;height:24px;min-width:24px;min-height:24px;margin:0 3px;padding:0;overflow:visible;border-radius:50%;border:1px solid var(--line);background:var(--btn);color:var(--mute);font-size:13px;font-weight:700;line-height:1;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ihelp::after{content:"";position:absolute;inset:-9px}
.ihelp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#iguide{position:fixed;inset:0;z-index:40;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:16px}
#iguide[hidden]{display:none}
#iguide button{padding:10px 24px}
#iguide .ig-intro{flex:0 0 auto;margin:0 0 8px;font-size:12.5px;line-height:1.4;color:var(--mute)}
#iguide .ig-list{flex:1 1 auto;min-height:0;overflow:auto;text-align:left;-webkit-overflow-scrolling:touch}
#iguide .ig-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
#iguide .ig-row .ico{width:28px;height:28px;flex:none;margin-top:1px}
#iguide .ig-row b{display:block;font-size:14px;margin-bottom:1px}
#iguide .ig-row span{display:block;font-size:12.5px;line-height:1.4;color:var(--mute)}
#iguide .ig-sec{margin:10px 0 2px;font-size:12px;font-weight:700;color:var(--accent);text-align:center}
html:lang(ko) #iguide{word-break:keep-all}
#app{height:calc(var(--appH,100%) - var(--adbox,0px));max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:4px;padding:4px 8px 8px;box-sizing:border-box}
.hud{display:grid;grid-template-columns:1.5fr 1fr 1fr auto auto;gap:8px;align-items:center}
.stat small{display:block;font-size:calc(var(--cs,20px)*.5);color:var(--mute)}
.stat b{display:block;font-size:calc(var(--cs,20px)*.85);font-variant-numeric:tabular-nums;line-height:1.2}
#next{display:block;border-radius:8px;border:1px solid var(--line);background:var(--well)}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:14px;touch-action:manipulation;cursor:pointer}
#pause{flex:none;width:calc(var(--cs,20px)*2.2);height:calc(var(--cs,20px)*2.2);font-size:calc(var(--cs,20px)*.8);padding:0}
#stage{position:relative;flex:1;min-height:0}
/* Ad strip: reserved under the controls with a gap so the banner is never tapped by accident. Height 0 = no ad. */
#rnd,#vs,#cpub,#rk{display:inline-flex;align-items:center;justify-content:center}
.bic{display:block;flex:none;width:24px;height:24px;margin-right:9px}
.bic svg{display:block;width:100%;height:100%}
#rnd .ric{position:relative;display:block;flex:none;width:24px;height:24px;margin-right:9px}
#rnd .ric i{position:absolute;display:block;width:5px;height:5px;border-radius:1.5px;box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.25);transition:left .4s cubic-bezier(.3,1.6,.5,1),top .4s cubic-bezier(.3,1.6,.5,1),background .4s}
#adslot{box-sizing:border-box;width:calc(100% - 16px);max-width:504px;height:var(--adh,50px);margin:4px auto 2px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,var(--well),var(--btn));position:relative;gap:8px;white-space:nowrap}
#adslot[hidden]{display:none}
/* House ad shown until a real ad arrives: the main-screen title, one line, same glass-drop letters. Only transform animations (cheap on phones). */
#adslot .adt{display:inline-flex;align-items:center;font-size:clamp(20px,6.6vw,27px);font-weight:800;line-height:1;letter-spacing:.02em}
#adslot .adt b{display:inline-block;padding:0 .015em;font-weight:800;background:linear-gradient(160deg,rgba(255,255,255,.95) 0,var(--c) 38%,var(--c2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;-webkit-text-stroke:1px var(--glb);animation:adbob 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*-.42s)}
#adslot .adt i{display:inline-block;width:.4em}
#adslot .ol{display:inline-flex;align-items:center;gap:4px;font-size:clamp(11px,3.4vw,14px);line-height:1;font-weight:800;font-style:italic;letter-spacing:.06em;transform:skewX(-8deg)}
#adslot .ol em{font-style:italic;background:linear-gradient(90deg,#34e08f 0,#c4ffe6 45%,#34e08f 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:olshine 2.2s linear infinite}
#adslot .sg{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
#adslot .sg u{display:block;width:3px;height:12px;border-radius:1.5px;background:#34e08f;box-shadow:0 0 5px rgba(52,224,143,.6);transform-origin:50% 100%;transform:scaleY(.33);animation:adbar 1s ease-in-out infinite;text-decoration:none}
#adslot .sg u:nth-child(2){animation-delay:.18s}
#adslot .sg u:nth-child(3){animation-delay:.36s}
#adslot::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.22),rgba(255,255,255,0));transform:translateX(-130%);animation:adsweep 4.6s ease-in-out infinite;pointer-events:none}
@keyframes adbob{0%,100%{translate:0 0;transform:scale(1,1)}50%{translate:0 -3px;transform:scale(.96,1.07)}}
@keyframes adbar{0%,100%{transform:scaleY(.33)}50%{transform:scaleY(1)}}
@keyframes adsweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(330%)}}
@media (prefers-reduced-motion:reduce){#adslot *,#adslot::after{animation:none!important}}
.well{position:absolute;line-height:0}
#side{position:absolute;display:flex;flex-direction:column;gap:6px;min-height:0}
:root{--fs:64px}
#side>*{flex-shrink:0}
#side .top{display:flex;gap:6px;align-items:center}
#side .meta{display:flex;flex-wrap:wrap;gap:0 6px;justify-content:space-between;font-size:calc(var(--cs,20px)*.5);color:var(--mute)}
#ol{font-size:calc(var(--cs,20px)*.55);font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mf{font-size:1.15em;vertical-align:middle}
#mywho{white-space:nowrap}
#ol[hidden]{display:none}
#oinv{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
#oinv[hidden]{display:none}
#oinv .sl{aspect-ratio:1/1;min-width:0;border-radius:6px;border:1px dashed var(--line);background:var(--well);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:2px}
#oinv .sl.f{border:1.5px solid var(--fire,#ff9a3c);background:var(--btn)}
#oinv .sl .ico{width:100%;height:100%}
.fl{font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif;font-weight:400}
.ccr{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
#cc{max-width:150px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:14px}
#lvbox{display:flex;flex-direction:column;align-items:center;gap:16px}
#lvbox .lvr{display:flex;gap:6px}
#lvbox .swr,#rcfg .swr{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:14px;row-gap:2px;padding:0 6px;max-width:100%;box-sizing:border-box}   /* labels share one column and the switches sit in a straight vertical line, with the ? in its own column */
.swr .swh{display:contents}
/* narrow Android screens: the label column may shrink and wrap, and the gaps are tighter, so the ? never gets pushed out of view */
#lvbox .swr,#rcfg .swr{grid-template-columns:minmax(0,auto) auto;column-gap:8px}
.swr .sw{min-width:0}
.swr .sw>span{min-width:0;overflow-wrap:anywhere}
.swr .ihelp{margin:0 2px}
.swr .sw{grid-column:1;justify-content:space-between}
.swr .ihelp{grid-column:2}
.swr>.sw:first-child,.swr>.swh:first-child .sw{grid-row:1}
.swr>.sw:nth-child(2),.swr>.swh:nth-child(2) .sw,.swr>.swh:nth-child(2) .ihelp{grid-row:2}
#rank .sw{flex:0 0 auto;justify-content:center;padding:0 0 10px}
#lvbox[hidden]{display:none}
#board{display:block;border-radius:10px;border:1px solid var(--line);background:var(--well);touch-action:none}
#ov{position:absolute;inset:0;border-radius:10px;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;line-height:1.4}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:34px;letter-spacing:-.02em}
#endfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:10px}
#endfx i{position:absolute;top:-3%;display:block;opacity:0;animation:cf var(--d,2.4s) var(--dl,0s) ease-in both}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),var(--h,600px)) rotate(var(--r,360deg))}}
#endem{font-size:56px;line-height:1;margin-bottom:2px}
#endem[hidden]{display:none}
#wait{position:relative;width:124px;height:124px;margin-bottom:2px;display:flex;align-items:center;justify-content:center}
#wait[hidden]{display:none}
#wait .rg{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:wping 2.4s ease-out infinite}
#wait .rg:nth-child(2){animation-delay:.8s}
#wait .rg:nth-child(3){animation-delay:1.6s}
#wait .pc{display:grid;grid-template-columns:repeat(3,17px);grid-auto-rows:17px;gap:2px;animation:wspin 2.4s infinite}
#wait .pc u{display:block;border-radius:5px;background:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 10px rgba(124,131,255,.45)}
#wait .pc u:nth-child(1){grid-column:2;grid-row:1}
#wait .pc u:nth-child(2){grid-column:1;grid-row:2}
#wait .pc u:nth-child(3){grid-column:2;grid-row:2}
#wait .pc u:nth-child(4){grid-column:3;grid-row:2}
@keyframes wping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.05);opacity:0}}
@keyframes wspin{0%{transform:rotate(0)}22%{transform:rotate(90deg)}25%{transform:rotate(90deg)}47%{transform:rotate(180deg)}50%{transform:rotate(180deg)}72%{transform:rotate(270deg)}75%{transform:rotate(270deg)}97%,100%{transform:rotate(360deg)}}
#ov.winfx{background:radial-gradient(circle at 50% 36%,rgba(255,206,84,.30),rgba(255,206,84,0) 62%),var(--veil)}
#ov.winfx h1{animation:winpop .75s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 0 18px rgba(255,200,60,.55)}
#ov.winfx #endem{animation:trophy 1s ease-out both}
#ov.losefx{background:linear-gradient(rgba(70,0,16,.38),rgba(70,0,16,0) 70%),var(--veil)}
#ov.losefx h1{animation:losedrop .6s ease-out both}
#ov.losefx #endem{animation:wob .95s ease-out both}
#ov.coolfx{background:linear-gradient(rgba(40,70,140,.28),rgba(40,70,140,0) 70%),var(--veil)}
#ov.coolfx h1{animation:losedrop .6s ease-out both}
#ov.coolfx #endem{animation:trophy 1s ease-out both}
#ov.still *{animation:none!important}
@keyframes winpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
@keyframes losedrop{0%{transform:translateY(-34px) scale(1.15);opacity:0}65%{transform:translateY(5px) scale(1);opacity:1}100%{transform:none}}
@keyframes trophy{0%{transform:translateY(-70px) scale(.4);opacity:0}55%{transform:translateY(8px) scale(1.15);opacity:1}100%{transform:none}}
@keyframes wob{0%{transform:translateY(-40px) rotate(0);opacity:0}45%{transform:translateY(0) rotate(-14deg);opacity:1}65%{transform:rotate(10deg)}85%{transform:rotate(-5deg)}100%{transform:none}}
#os:empty{display:none!important}   /* main menu has no instruction line */
#ov p{margin:0;font-size:14px;color:var(--mute);max-width:240px}
#ot,#os{text-wrap:balance}
html:lang(ko) #ov h1,html:lang(ko) #ov p{word-break:keep-all;overflow-wrap:normal}
#os .rc{color:#ffd54a;font-size:1.7em;font-weight:800;letter-spacing:.1em;display:inline-block;line-height:1.3;text-shadow:0 0 14px rgba(255,213,74,.35);cursor:pointer;padding:0 .15em;border-radius:12px;background:rgba(255,213,74,.12);-webkit-tap-highlight-color:rgba(255,213,74,.25)}
#os .rc::after{content:" 📋";font-size:.55em;letter-spacing:0;opacity:.85}
#os .rc.ok::after{content:" " attr(data-t);color:#fff;font-size:.45em;font-weight:700}
#os .rc:active{transform:scale(.96)}
#go{margin-top:6px;padding:14px 34px;font-size:18px;font-weight:700;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
#settings{position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;padding:0;border-radius:50%;font-size:23px;display:flex;align-items:center;justify-content:center;line-height:1}
#settings:focus-visible{outline-offset:2px}
#cpop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30;line-height:1}
#cpop .cp,#ocpop .cp{display:flex;flex-direction:column;align-items:center;font-family:"Jua","Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Apple SD Gothic Neo","PingFang SC","PingFang TC","Noto Sans CJK SC","Noto Sans CJK TC","Noto Sans CJK JP",system-ui,sans-serif;font-weight:900;letter-spacing:.02em;will-change:transform,opacity;--fill:#ffd93d;--ext:#e07a00}
#cpop .cp.t1,#ocpop .cp.t1{--fill:#ffa54a;--ext:#d44a00}
#cpop .cp.t2,#ocpop .cp.t2{--fill:#ff74b8;--ext:#c2185b}
#cpop .cp.t3,#ocpop .cp.t3{--fill:#8c6bff;--ext:#3b1fb8}
#cpop .cp span,#ocpop .cp span{display:block;color:var(--fill);text-shadow:.06em 0 #fff,-.06em 0 #fff,0 .06em #fff,0 -.06em #fff,.045em .045em #fff,-.045em .045em #fff,.045em -.045em #fff,-.045em -.045em #fff,0 .13em 0 var(--ext),0 .17em .12em rgba(0,0,0,.25)}
#cpop .ct,#ocpop .ct{font-size:calc(var(--cs,24px)*1.35)}
#cpop .cn,#ocpop .cn{font-size:calc(var(--cs,24px)*3.6);margin-top:-.08em}
#cpop .cn i,#ocpop .cn i{font-style:normal;font-size:.6em;margin-left:.04em}
#cpop .csp,#ocpop .csp{position:absolute;left:50%;top:50%;width:calc(var(--cs,24px)*.9);height:calc(var(--cs,24px)*.9);margin:calc(var(--cs,24px)*-.45) 0 0 calc(var(--cs,24px)*-.45);will-change:transform,opacity}
#cpop .csp svg,#ocpop .csp svg{width:100%;height:100%;display:block}
/* the opponent's combo pop-up sits over their board (fixed, so no transformed parent can shift it) */
#ocpop{position:fixed;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;line-height:1}
#vs,#rnd,#cpub,#rs,#qt,#netbox button,#lvbox button{padding:8px 14px;font-size:14px}
#lvbox .lvr button{padding:8px 10px}
#lback{background:transparent}
.sw{position:relative;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:6px 0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
#netbox{display:flex;flex-direction:column;justify-content:center;gap:12px;align-items:center;width:100%}
#netbox .nrow{display:flex;gap:10px;width:100%;max-width:300px}
#ov.att #netbox .nrow button,#netbox .nrow button{flex:1 1 0;min-width:0;box-sizing:border-box;min-height:48px;padding:8px 6px;font-size:clamp(12px,3.7vw,15px);line-height:1.2;white-space:normal;overflow-wrap:break-word;text-wrap:balance;text-align:center;display:flex;align-items:center;justify-content:center}
#netbox[hidden]{display:none}
#code{width:100%;max-width:240px;min-width:0;box-sizing:border-box;padding:12px 4px;min-height:58px;border-radius:20px;border:2px solid var(--line);background:var(--btn);color:var(--ink);font:inherit;font-size:clamp(20px,7vw,28px);line-height:1.25;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2em;text-indent:.2em;text-align:center;overflow:visible}   /* 6 digits must fit on any phone width, with room above and below the glyphs */
#code::placeholder{color:var(--mute);opacity:.5}
#code:focus{outline:3px solid var(--accent);outline-offset:2px}
#opp{display:block;border-radius:8px;border:1px solid var(--line);background:var(--well)}
#opp[hidden]{display:none}
.ctl{--bh:clamp(44px,5.8vh,52px);padding-bottom:2px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.cl{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,var(--bh));gap:16px 14px;width:min(100%,var(--cw,100%));justify-self:start}   /* arrow pad is never wider than the play field (--cw is set in resize) */
.cl [data-act="down"]{grid-column:1/3;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
.cl [data-act="down"] .ar{font-size:20px;line-height:1}

  border-radius:30px !important;
  color:#fff;
  background:linear-gradient(180deg,#6a88c2 0%,#4b6aa3 54%,#34507f 100%);   /* soft blue: same family as rotate/drop, a little quieter */
  border:2px solid #22385a;
  text-shadow:0 1px 2px rgba(10,24,52,.5);
  box-shadow:
    0 6px 0 #1a2c48,
    0 10px 12px rgba(0,0,0,.25),
    inset 0 3px 5px rgba(255,255,255,.4),
    inset 0 -5px 8px rgba(10,22,48,.28);
  transition:transform .06s,box-shadow .06s,filter .06s;
}
.cl > button::before{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  top:5%;
  height:34%;
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));
  pointer-events:none;
}
.cl > button:active,
.cl > button.on{
  transform:translateY(5px);
  box-shadow:
    0 1px 0 #1a2c48,
    0 2px 4px rgba(0,0,0,.22),
    inset 0 2px 4px rgba(255,255,255,.26),
    inset 0 -3px 6px rgba(10,22,48,.24);
  filter:brightness(.97);
}
.cl > button[data-act="down"]{
  border-radius:30px !important;
}


/* ===== Diamond pad: item (top), rotate (right), drop (bottom). Icons only, sits right next to the arrow keys. ===== */
.ctl{--b:calc(var(--bh)*1.18);--dx:calc(var(--b)*.95);--dy:calc(var(--b)*.6);grid-template-columns:minmax(0,1fr) auto;align-items:center}
.cr{display:block;position:relative;width:calc(var(--b) + var(--dx));height:calc(var(--b) + var(--dy)*2);min-height:0;transform:translateY(-6px)}
.cr #rotb,.cr [data-act="hard"],.cr #fire:not(.nof){position:absolute;width:var(--b);height:var(--b);min-height:0;margin:0;padding:0;border-radius:50%;box-sizing:border-box;gap:0;z-index:1}
.cr #fire:not(.nof){left:0;top:0;right:auto;bottom:auto}
.cr #rotb{right:0;left:auto;top:calc(50% - var(--b)/2);bottom:auto}
/* Item mode: the stack on the right moved up level with the item bar, so the diamond (fire button on top) moves up with it by the same amount.
   Its layout height is cut down to the arrow keys' height, and the board gets the room that frees. */
.ctl:not(.noitem){--dx:calc(var(--b)*1);--dy:calc(var(--b)*.68)}   /* a little more air between the item, turn and drop buttons */
.ctl:not(.noitem) .cr{align-self:start;margin-bottom:calc(var(--bh)*2 + 16px - var(--b) - var(--dy)*2);transform:translateY(calc(2px - var(--lift,0px)))}   /* +2px instead of -6px: leaves a gap under the opponent board */
.cr [data-act="hard"]{left:0;bottom:0;top:auto;right:auto}
.cr [data-act="hard"] svg,.cr #rotb .dz,.cr #rotb .dz svg,.cr #fire .fz{width:clamp(26px,7.6vw,33px);height:clamp(26px,7.6vw,33px)}
.cr #fire .fz svg{width:100%;height:100%}
.cr #fire .fb{top:-6px;right:-6px;width:22px;height:22px}

/* ===== Controls v2 =====
   Left pad: left / down / right in one row (down in the middle). The control area keeps its height, because the item/rotate/drop cluster on the right sets it.
   Fire: dark round button with a yellow arrow that lights up when an item is queued. Rotate: brighter blue with a glow, a little larger. Drop: a bit smaller, farther from rotate. */
.cl{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:calc(var(--bh)*1.45);gap:10px;align-self:center}
.cl [data-act="left"]{grid-column:1;grid-row:1}
.cl [data-act="down"]{grid-column:2;grid-row:1;width:auto;justify-self:stretch}
.cl [data-act="right"]{grid-column:3;grid-row:1}
.cl > button,.cl > button[data-act="down"]{border-radius:26px !important}
.cl [data-act="down"] .ar{font-size:22px}
#fire{--fire:#ffd23f;color:#ffd23f;border:2px solid #0b1424;background:radial-gradient(circle at 35% 24%,#34445f 0,#1f2d47 55%,#121c30 100%);box-shadow:0 6px 0 #080f1b,0 10px 12px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.2)}
#fire.on,#fire:active{background:radial-gradient(circle at 35% 24%,#34445f 0,#1f2d47 55%,#121c30 100%);box-shadow:0 1px 0 #080f1b,0 3px 6px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.15)}
#fire .fz{filter:drop-shadow(0 0 6px rgba(255,210,63,.75))}
#fire .fz svg g{fill:#ffd23f;stroke:#ffd23f}
#fire .fz svg path[stroke]{stroke:#ffd23f}
#fire .fb{border-color:#ffd23f}
#fire.empty{opacity:1;filter:none}
#fire.empty .fz{filter:none;opacity:.5}
#fire.empty .fz svg g{fill:#8a96ab;stroke:#8a96ab}
#fire.empty .fz svg path[stroke]{stroke:#8a96ab}
.ctl #rotb{background:radial-gradient(circle at 35% 24%,#a3dcff 0,#43a6ff 34%,#1f7bff 70%,#1560d8 100%);border:2px solid #0f4fb8;box-shadow:0 6px 0 #0d3f94,0 0 20px rgba(48,150,255,.65),0 10px 12px rgba(0,0,0,.25),inset 0 3px 5px rgba(255,255,255,.55)}
.ctl #rotb:active,.ctl #rotb.on{box-shadow:0 1px 0 #0d3f94,0 0 14px rgba(48,150,255,.5),0 2px 4px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.35)}
.cr #rotb{width:calc(var(--b)*1.1);height:calc(var(--b)*1.1);top:calc(50% - var(--b)*.55)}
.cr [data-act="hard"]{width:calc(var(--b)*.92);height:calc(var(--b)*.92);left:calc(var(--b)*.04)}
</style>

  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){

    units.forEach(function(u,i){u.g=false;u.cells.forEach(function(k){occ[k.r+u.d][k.c]=i})});

  a.push({nick:e.nick,score:e.score,lines:e.lines,cc:e.cc||''});

function pickCfg(a,b){
  if(a.sv!==b.sv)return a.sv>b.sv?a:b;

  countTimer=setInterval(function(){
    if(state!=='count'||mode!=='vs'||!room){clearInterval(countTimer);countTimer=null;return;}
    n--;

    clearInterval(countTimer);countTimer=null;
    gs=seed;gravity=!!cfg.gv;itemMode=!!cfg.it;myRdy=false;sentG='';

var joinToken=0;
/* A fresh random room code. The creator checks that nobody is already in that room before using it (see joinRoom). */
/* Android can close the page while another app (KakaoTalk, to send the code) is in front. So the room is remembered
   for a few minutes: coming back re-enters the same room with the same code, and "Create room" reuses it. */
var ROOM_KEY='tetris-room';
function savedRoom(maxAge){
  try{
    var r=JSON.parse(localStorage.getItem(ROOM_KEY)||'null');
    if(r&&typeof r.code==='string'&&r.code.length===ROOM_LEN&&/^\d+$/.test(r.code)&&typeof r.t==='number'&&Date.now()-r.t<=maxAge)return r;
  }catch(e){}

}
function saveRoom(code,creator,pid,rnd){try{localStorage.setItem(ROOM_KEY,JSON.stringify({code:code,creator:!!creator,rnd:!!rnd,pid:pid||'',t:Date.now()}))}catch(e){}}

function genCode(){
  var range=Math.pow(10,ROOM_LEN),n;   /* every code from 0000 to 9999 is allowed; the code is always handled as text, so a leading zero is safe */
  try{n=crypto.getRandomValues(new Uint32Array(1))[0]}catch(e){n=Math.floor(Math.random()*4294967296)}

function createRoom(n){

function joinRoom(code,opts){

  lock(true);
  createSupabaseRoom(code,opts&&opts.pid).then(function(rm){
    if(token!==joinToken){rm.leave().catch(function(){});return;}
    room=rm;mode='vs';state='net';
    if(rm.onLost)rm.onLost(connLost);
    var info={rdy:false,dead:false,gs:0,atk:0,g:'',sc:0,gv:cfg.gv,it:cfg.it,sv:cfg.sv,lk:0,t:Date.now(),cc:myCC};
    if(create<0)rm.onPeers(onPeers);

      return create>=0?new Promise(function(r){setTimeout(r,450)}):0;
    }).then(function(){
      if(token!==joinToken)return;
      if(create>=0){

        if(rm.peers().some(function(p){return !p.sameTab})){

/* ===== Random match =====
   Everybody who wants a quick game waits in one shared lobby channel. Players are ordered by how long they have
   been waiting and paired 1+2, 3+4, ... The first of each pair makes a fresh random room code and sends it to the
   second; both then leave the lobby and join that room. */
function leaveLobby(){
  var L=lobby;if(!L)return;
  lobby=null;L.left=true;clearInterval(L.timer);
  if(L.ch){try{getClient().removeChannel(L.ch)}catch(e){}}
}
function findMatch(){
  joinToken++;leaveRoom();leaveLobby();
  $('join').disabled=false;$('mk').disabled=false;$('rnd').disabled=false;
  mode='solo';state='ready';resize();
  overlay('rndtitle','rndfinding','',false);ovui(false);$('qt').style.display='';$('wait').hidden=false;$('ov').classList.toggle('still',!!reduceMotion);
  if(!supabaseReady()){setOS('joinfail');return}
  var client=getClient();
  var id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('l-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  var L={left:false,ch:null,id:id,t:Date.now(),offer:null,matched:false,timer:null,subscribed:false};
  lobby=L;
  function fail(){if(lobby!==L)return;leaveLobby();setOS('joinfail')}
  function members(){
    var ps=(L.ch&&L.ch.presenceState())||{},a=[];
    Object.keys(ps).forEach(function(k){
      var arr=ps[k]||[];if(!arr.length)return;
      var m=arr[arr.length-1]||{};
      a.push({id:k,t:(typeof m.t==='number'&&isFinite(m.t))?m.t:0});
    });
    a.sort(function(x,y){return (x.t-y.t)||(x.id<y.id?-1:1)});
    return a;
  }
  function accept(code){
    if(lobby!==L||L.matched)return;
    L.matched=true;leaveLobby();
    roomCode=code;setOS('connecting');joinRoom(code,{rnd:true});
  }
  function tick(){
    if(lobby!==L||L.matched||!L.ch||!L.subscribed)return;
     var tickNow=Date.now();if(L.lastTick&&tickNow-L.lastTick<350)return;L.lastTick=tickNow;
    var w=members(),i=-1;
    w.forEach(function(x,j){if(x.id===id)i=j});
    if(i<0)return;                                           /* not announced yet */
    /* we already offered a room and our partner has left the lobby: they took it */
    if(L.offer&&L.offer.n>0&&!w.some(function(x){return x.id===L.offer.to})){accept(L.offer.code);return}
    if(i%2!==0||!w[i+1]){L.offer=null;return}                /* second of a pair: wait for the code */
    var partner=w[i+1].id;
    if(L.offer&&L.offer.to!==partner)L.offer=null;
    if(!L.offer)L.offer={to:partner,code:genCode(),n:0};
    L.offer.n++;
    try{L.ch.send({type:'broadcast',event:'match',payload:{from:id,to:partner,code:L.offer.code}})}catch(e){}
  }
  var topic='tt-lobby',stale=[];
  try{stale=(client.getChannels?client.getChannels():[]).filter(function(c){return c&&(c.topic==='realtime:'+topic||c.topic===topic)})}catch(e){}
  Promise.all(stale.map(function(c){return Promise.resolve().then(function(){return client.removeChannel(c)}).catch(function(){})})).then(function(){
    if(lobby!==L)return;
    var ch=client.channel(topic,{config:{presence:{key:id},broadcast:{self:false,ack:false}}});
    L.ch=ch;
    ch.on('presence',{event:'sync'},tick);
    ch.on('broadcast',{event:'match'},function(m){
      var pl=m&&m.payload;
      if(lobby!==L||L.matched||!pl||pl.to!==id||typeof pl.from!=='string')return;
      var code=String(pl.code||'');
      if(code.length!==ROOM_LEN||!/^\d+$/.test(code))return;
      if(!members().some(function(x){return x.id===pl.from}))return;
      accept(code);
    });
    ch.subscribe(function(status){
      if(lobby!==L||ch!==L.ch)return;
      if(status==='SUBSCRIBED'){
        L.subscribed=true;
        ch.track({t:L.t}).then(tick).catch(fail);
      }else if(!L.subscribed&&(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')){fail()}
    });
    L.timer=setInterval(tick,900);
  }).catch(fail);
}

/* Tapping the yellow room code shares it (share sheet on phones, clipboard otherwise). */
function shareRoomCode(el){

  var text='BRICK DUEL: '+c,android=/Android/i.test(navigator.userAgent||'');
  function done(){if(!el)return;el.setAttribute('data-t',tr('copied'));el.classList.add('ok');setTimeout(function(){el.classList.remove('ok')},1500)}
  function copy(){
    function legacy(){
      try{var t=document.createElement('textarea');t.value=c;t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(t);t.select();t.setSelectionRange(0,99);var ok=document.execCommand('copy');document.body.removeChild(t);if(ok)done()}catch(e){}

function detectLang(){var pref='';try{pref=localStorage.getItem('tetris-language')||'auto'}catch(e){}LANG_PREF=pref;var raw=pref==='auto'?((navigator.languages&&navigator.languages[0])||navigator.language||'en'):pref;raw=String(raw).replace('_','-');if(raw.toLowerCase().indexOf('zh-tw')===0||raw.toLowerCase().indexOf('zh-hk')===0)return 'zh-TW';if(raw.toLowerCase().indexOf('zh')===0)return 'zh-CN';var key=raw.split('-')[0].toLowerCase();return I18N[key]?key:'en'}
function tr(key){return (I18N[LANG]&&I18N[LANG][key])||I18N.en[key]||key}
function applyLanguage(){
 LANG=detectLang();
 try{document.documentElement.lang=LANG}catch(e){}
 var sel=$('languageSelect');if(sel)sel.value=LANG_PREF;
 function txt(id,key){var el=$(id);if(el)el.textContent=tr(key)}
 function aria(el,key){if(el)el.setAttribute('aria-label',tr(key))}
 txt('settingstitle','settings');txt('languageLabel','language');
 [['rktn','rkclassic'],['rkti','items'],['cgv','gravity'],['cit','items'],['kgv','gravity'],['rgv','gravity'],['rit','items'],['ghv','landing'],['snd','sound']].forEach(function(p){var el=$(p[0]),sp=el&&el.querySelector('span');if(sp)sp.textContent=tr(p[1])});
 txt('settingsback','back');txt('rs','restart');txt('qt','main');setIconBtn('vs','battle',ICO_PEOPLE);setIconBtn('rk','ranking',ICO_CROWN);setIconBtn('cpub','cpu',ICO_ROBOT);txt('dtcap','dtap');txt('join','join');txt('mk','mk');setRndBtn();txt('back','back');txt('lback','back');txt('nsave','save');txt('nskip','skip');txt('rstart','startgame');txt('rclose','close');
 txt('lvl','level');txt('lnl','lines');
 var vol=$('musicvol');if(vol&&vol.querySelector('label span'))vol.querySelector('label span').textContent=tr('music');
 var opts=document.querySelectorAll('#lvbox button[data-l]');if(opts.length>=3){opts[0].textContent=tr('easy');opts[1].textContent=tr('normal');opts[2].textContent=tr('hard')}
 var ctl=document.querySelector('[data-act="rot"]');if(ctl)ctl.setAttribute('aria-label',tr('rotate'));txt('rotLabel','rotate');txt('dropLabel','drop');aria(document.querySelector('[data-act="hard"]'),'drop');
 var fl=$('firel');if(fl)fl.textContent=tr('fire');aria($('fire'),'fire');aria($('inv'),'itemqueue');Array.prototype.forEach.call(document.querySelectorAll('.ihelp'),function(e){e.setAttribute('aria-label',tr('itemguide'));e.title=tr('itemguide')});
 aria(document.querySelector('[data-act="left"]'),'left');aria(document.querySelector('[data-act="right"]'),'right');aria(document.querySelector('[data-act="down"]'),'down');
 var st=$('settings');if(st){st.setAttribute('aria-label',tr('settings'));st.title=tr('settings')}
 aria($('pause'),'pause');aria($('next'),'nextpiece');aria($('musicvolc'),'musicaria');aria($('mf'),'country');
 $('languageSelect').querySelector('option[value="auto"]').textContent=tr('automatic');
 $('nick').placeholder=tr('nickname');aria($('nick'),'nickname');
 var codeTxt=fmt('roomcode',{n:ROOM_LEN});$('code').placeholder=new Array(ROOM_LEN+1).join('0');$('code').setAttribute('aria-label',codeTxt);
 var rank=$('rank');if(rank){rank.setAttribute('aria-label',tr('ranking').replace('👑 ',''));var h=rank.querySelector('h2');if(h)h.textContent=tr('top')}
 initDN(LANG);syncCC();
 olabel();
 renderOverlay();
}
/* ===== Item guide popup ===== */
var GUIDE_ALL=['bomb','laser','nuke','slow'],GUIDE_VS=['shield','junk','speed','fog','rev','swap'];
function guideRow(k){return '<div class="ig-row">'+iconSVG(k)+'<div><b>'+itemName(k)+'</b><span>'+tr('d_'+k)+'</span></div></div>'}
function openGuide(){
  var g=$('iguide');if(!g)return;
  g.querySelector('h2').textContent=tr('itemguide');
  g.querySelector('.ig-intro').textContent=tr('itemhelp');
  g.querySelector('.ig-list').innerHTML=GUIDE_ALL.map(guideRow).join('')+'<div class="ig-sec">'+tr('ig_vs')+'</div>'+GUIDE_VS.map(guideRow).join('');
  $('igclose').textContent=tr('close');
  g.setAttribute('aria-label',tr('itemguide'));
  g.hidden=false;
}
function closeGuide(){var g=$('iguide');if(g)g.hidden=true}
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('.ihelp'):null;
  if(t){e.preventDefault();e.stopPropagation();openGuide();return}
  if(e.target&&e.target.id==='iguide')closeGuide();
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.classList&&t.classList.contains('ihelp')){e.preventDefault();openGuide();return}
  if(e.key==='Escape'&&$('iguide')&&!$('iguide').hidden){e.preventDefault();e.stopPropagation();closeGuide()}
},true);
$('igclose').addEventListener('click',closeGuide);
$('languageSelect').addEventListener('change',function(){LANG_PREF=this.value;try{localStorage.setItem('tetris-language',LANG_PREF)}catch(e){}applyLanguage();});
applyLanguage();

grid=emptyGrid();
overlay('tetris','','start',true);
resize();hud();if(musicVolume>0)playMusic();
requestAnimationFrame(function(t){last=t;loop(t)});
try{new MutationObserver(fitOvSoon).observe($('ov'),{subtree:true,childList:true,attributes:true,attributeFilter:['hidden','class']})}catch(e){}
try{new ResizeObserver(fitOvSoon).observe($('ov'))}catch(e){window.addEventListener('resize',fitOvSoon)}
fitOvSoon();
/* Came back after the page was closed (e.g. while sharing the code)? Go straight back into the same room. */
(function(){
  var r=savedRoom(10*60*1000);
  if(!r||!supabaseReady())return;
  $('vs').click();
  roomCode=r.code;setOS('connecting');
  joinRoom(r.code,{pid:r.pid,creator:r.creator,rnd:r.rnd});
})();
})();
